<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>schoolgame | RIVALS FPS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{user-select:none}
button,input{font:inherit}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#182133,#080b12 48%,#020307);z-index:50}
.box{width:min(520px,92vw);padding:32px;border:1px solid #29344a;border-radius:20px;background:rgba(9,13,22,.96);box-shadow:0 30px 100px #000b}
.logo{text-align:center;font-size:52px;font-weight:900;letter-spacing:5px}.logo b{color:#ff334d}
.sub{text-align:center;color:#8996ac;margin:6px 0 26px}
input{width:100%;padding:14px 15px;margin:6px 0;border:1px solid #2d384d;border-radius:10px;outline:0;background:#080c14;color:#fff}
input:focus{border-color:#ff334d}
button{width:100%;padding:14px;margin-top:9px;border:0;border-radius:10px;background:#ff334d;color:#fff;font-weight:900;cursor:pointer}
button.secondary{background:#151d2c}button.bot{background:#6732d9}button.back{background:#111722;border:1px solid #2b374c}
#status{text-align:center;min-height:22px;margin-top:12px;color:#ff6b7d}
.help{text-align:center;color:#6f7c92;font-size:13px;line-height:1.7;margin-top:18px}
#lobby{display:none;text-align:center}.room{padding:18px;margin:15px 0;border:1px solid #39465e;border-radius:14px;background:#0d1420}
.room small{display:block;color:#8190a7}.code{font-size:40px;font-weight:900;letter-spacing:8px;color:#ff334d;margin-top:5px}
#lobbyState{padding:12px;border-radius:10px;background:#080c14;border:1px solid #263249;color:#ffca58;font-weight:800}
#game{display:none;position:fixed;inset:0;background:#05080d}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:18px;right:18px;top:15px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.card{padding:9px 14px;border-radius:10px;background:#070a10cc;border:1px solid #29354b;min-width:150px;text-align:center;font-weight:900}
.red{border-color:#7e2635}.blue{border-color:#245083}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 5px #000}
#cross:before{width:2px;height:22px;left:10px;top:0}#cross:after{height:2px;width:22px;left:0;top:10px}
#hit{position:fixed;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%) rotate(45deg);opacity:0;z-index:7;pointer-events:none}
#hit:before,#hit:after{content:"";position:absolute;background:#ff334d}.hitshow{opacity:1!important}
#hit:before{width:3px;height:32px;left:14px}.hit:after{height:3px;width:32px;top:14px}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:8px;background:#05080dbb;color:#9aa7bb;font-size:12px;z-index:5}
#toast{position:fixed;left:50%;top:72%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:10px;background:#080c14ee;border:1px solid #344157;font-weight:900;opacity:0;transition:.2s;z-index:10}
#toast.show{opacity:1}
#over{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#000b;backdrop-filter:blur(6px);z-index:20}
.overbox{width:min(430px,90vw);padding:35px;border-radius:18px;text-align:center;background:#0b1019;border:1px solid #2b3850}
.overbox h1{font-size:44px;margin:0 0 10px}
</style>
</head>
<body>

<div id="menu">
  <div class="box">
    <div id="main">
      <div class="logo">RI<b>V</b>ALS</div>
      <div class="sub">schoolgame first-person arena</div>
      <input id="name" maxlength="16" placeholder="შენი სახელი">
      <button id="create">CREATE ROOM</button>
      <input id="room" maxlength="5" placeholder="ROOM CODE" style="text-transform:uppercase">
      <button id="join" class="secondary">JOIN ROOM</button>
      <div id="status"></div>
      <div class="help">WASD — მოძრაობა · Mouse — კამერა · Left Click — სროლა<br>პირველი 10 kill იგებს</div>
    </div>

    <div id="lobby">
      <div class="logo">RI<b>V</b>ALS</div>
      <h2>🎮 LOBBY</h2>
      <div class="room"><small>ROOM CODE</small><div class="code" id="roomCode">-----</div></div>
      <button id="copy" class="secondary">📋 კოდის კოპირება</button>
      <div id="lobbyState">👤 1 / 2 მოთამაშე</div>
      <button id="bot" class="bot">🤖 BOT-ის გამოძახება</button>
      <button id="back" class="back">← უკან</button>
      <div class="help">გაუგზავნე კოდი მეგობარს ან დააჭირე BOT-ს.</div>
    </div>
  </div>
</div>

<div id="game">
  <canvas id="view"></canvas>
  <div id="hud">
    <div class="card red">YOU<br><span id="myScore">0</span></div>
    <div class="card blue">RIVAL<br><span id="enemyScore">0</span></div>
  </div>
  <div id="cross"></div>
  <div id="hit"></div>
  <div id="hint">WASD · MOUSE · CLICK</div>
  <div id="toast"></div>
</div>

<div id="over">
  <div class="overbox">
    <h1 id="overTitle">YOU WIN</h1>
    <div id="overText">Match finished</div>
    <button id="again">PLAY AGAIN</button>
  </div>
</div>

<script>
const SERVER_URL="wss://schoolgame-rivals.onrender.com";

const canvas=document.getElementById("view");
const ctx=canvas.getContext("2d");
const menu=document.getElementById("menu");
const main=document.getElementById("main");
const lobby=document.getElementById("lobby");
const game=document.getElementById("game");
const statusEl=document.getElementById("status");
const lobbyState=document.getElementById("lobbyState");
const roomCodeEl=document.getElementById("roomCode");
const botBtn=document.getElementById("bot");
const toast=document.getElementById("toast");
const over=document.getElementById("over");

let socket=null, myId=null, roomCode="", running=false, pointerLocked=false;
let state={players:[],bullets:[],score:{p1:0,p2:0}};
let keys={w:false,a:false,s:false,d:false};
let mouseDX=0, shooting=false, lastFrame=0, toastTimer=0;

const FOV=Math.PI/3;
const MAP=[
"1111111111111111",
"1000000000000001",
"1000110001100001",
"1000000000000001",
"1011001110011001",
"1000000000000001",
"1000010000100001",
"1000010000100001",
"1000000000000001",
"1011001110011001",
"1000000000000001",
"1000110001100001",
"1000000000000001",
"1111111111111111"
];
const MW=MAP[0].length,MH=MAP.length;

function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener("resize",resize);resize();

function connect(){
  if(socket && socket.readyState===WebSocket.OPEN)return Promise.resolve();
  statusEl.textContent="სერვერთან დაკავშირება...";
  return new Promise((resolve,reject)=>{
    socket=new WebSocket(SERVER_URL);
    socket.onopen=()=>{statusEl.textContent="";resolve()};
    socket.onerror=()=>{statusEl.textContent="სერვერთან დაკავშირება ვერ მოხერხდა.";reject()};
    socket.onclose=()=>{if(running) showToast("❌ სერვერთან კავშირი გაწყდა")};
    socket.onmessage=e=>{try{handle(JSON.parse(e.data))}catch{}};
  });
}

document.getElementById("create").onclick=async()=>{
  try{await connect();socket.send(JSON.stringify({type:"create_room",name:getName()}))}catch{}
};
document.getElementById("join").onclick=async()=>{
  const r=document.getElementById("room").value.trim().toUpperCase();
  if(!r){statusEl.textContent="შეიყვანე Room Code.";return}
  try{await connect();socket.send(JSON.stringify({type:"join_room",room:r,name:getName()}))}catch{}
};
function getName(){return document.getElementById("name").value.trim()||"PLAYER"}
document.getElementById("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(roomCode);showToast("📋 კოდი დაკოპირდა")}catch{showToast(roomCode)}
};
document.getElementById("bot").onclick=()=>{
  if(socket?.readyState===WebSocket.OPEN){
    botBtn.disabled=true;botBtn.textContent="🤖 BOT შემოდის...";
    socket.send(JSON.stringify({type:"add_bot"}));
  }
};
document.getElementById("back").onclick=()=>location.reload();

function handle(d){
  if(d.type==="room_created"||d.type==="room_joined"){
    myId=d.playerId;roomCode=d.room;roomCodeEl.textContent=roomCode;
    main.style.display="none";lobby.style.display="block";menu.style.display="flex";
    return;
  }
  if(d.type==="error"){statusEl.textContent=d.message;return}
  if(d.type==="bot_joined"){showToast("🤖 BOT შემოვიდა");if(!running)startGame();return}
  if(d.type==="state"){
    state=d;
    if(!running && d.players.length>=2)startGame();
    if(!running){lobbyState.textContent="👤 "+d.players.length+" / 2 მოთამაშე";return}
    updateHud();return;
  }
  if(d.type==="hit_confirm"){flashHit();return}
  if(d.type==="game_over"){endGame(d.winner);return}
  if(d.type==="message"){showToast(d.message)}
}

function startGame(){
  running=true;menu.style.display="none";game.style.display="block";over.style.display="none";
  document.body.requestPointerLock?.();
}
function endGame(winnerId){
  running=false;document.exitPointerLock?.();over.style.display="flex";
  document.getElementById("overTitle").textContent=winnerId===myId?"🏆 YOU WIN":"💀 YOU LOST";
  document.getElementById("overText").textContent=winnerId===myId?"შენ მოიგე მატჩი!":"მატჩი დასრულდა.";
}
document.getElementById("again").onclick=()=>{over.style.display="none";showToast("ახალი მატჩისთვის ახალი ROOM შექმენი")};

document.addEventListener("pointerlockchange",()=>{pointerLocked=document.pointerLockElement===canvas});
canvas.addEventListener("click",()=>{
  if(running&&!pointerLocked)canvas.requestPointerLock?.();
  if(running){shooting=true;sendInput()}
});
addEventListener("mousedown",e=>{if(e.button===0&&running){shooting=true;sendInput()}});
addEventListener("mouseup",e=>{if(e.button===0){shooting=false;sendInput()}});
addEventListener("mousemove",e=>{if(running&&pointerLocked)mouseDX+=e.movementX});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k in keys){keys[k]=true;sendInput();e.preventDefault()}
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k in keys){keys[k]=false;sendInput();e.preventDefault()}
});
addEventListener("contextmenu",e=>e.preventDefault());

function sendInput(){
  if(socket?.readyState!==WebSocket.OPEN||!running)return;
  const dx=mouseDX;mouseDX=0;
  socket.send(JSON.stringify({type:"input",keys,mouseDX:dx,shooting}));
}

setInterval(sendInput,50);

function me(){return state.players.find(p=>p.id===myId)}
function enemy(){return state.players.find(p=>p.id!==myId)}

function updateHud(){
  const a=me(),b=enemy();
  document.getElementById("myScore").textContent=a?.kills??0;
  document.getElementById("enemyScore").textContent=b?.kills??0;
}

function showToast(t){
  toast.textContent=t;toast.classList.add("show");clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),1800);
}
function flashHit(){
  const h=document.getElementById("hit");h.classList.add("hitshow");
  setTimeout(()=>h.classList.remove("hitshow"),90);
}

function wall(x,y){
  const mx=Math.floor(x),my=Math.floor(y);
  return mx<0||my<0||mx>=MW||my>=MH||MAP[my][mx]==="1";
}
function drawScene(){
  const w=canvas.width,h=canvas.height;
  ctx.fillStyle="#0b1220";ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#111a28";ctx.fillRect(0,h/2,w,h/2);

  const meP=me();
  if(!meP){requestAnimationFrame(drawScene);return}

  const depth=new Float32Array(w);
  const horizon=h/2;

  for(let x=0;x<w;x++){
    const cam=2*x/w-1;
    const rayA=meP.angle+cam*(FOV/2);
    const dx=Math.cos(rayA),dy=Math.sin(rayA);
    let d=0,hit=false,side=0;
    while(d<22&&!hit){
      d+=0.035;
      const rx=meP.x+dx*d,ry=meP.y+dy*d;
      if(wall(rx,ry)){hit=true;side=(Math.floor(rx)!==Math.floor(rx-dx*.04))?0:1}
    }
    const corr=Math.max(.01,d*Math.cos(rayA-meP.angle));
    depth[x]=corr;
    const line=Math.min(h*1.8,h/(corr));
    const top=horizon-line/2;
    const shade=Math.max(20,110-corr*5-(side?10:0));
    ctx.fillStyle=`rgb(${Math.floor(shade*.55)},${Math.floor(shade*.65)},${Math.floor(shade*.82)})`;
    ctx.fillRect(x,top,1,line);
  }

  const visible=state.players.filter(p=>p.id!==myId&&p.alive).map(p=>{
    const dx=p.x-meP.x,dy=p.y-meP.y;
    const dist=Math.hypot(dx,dy);
    let rel=Math.atan2(dy,dx)-meP.angle;
    while(rel>Math.PI)rel-=Math.PI*2;while(rel<-Math.PI)rel+=Math.PI*2;
    return {...p,dist,rel};
  }).filter(p=>Math.abs(p.rel)<FOV*.72).sort((a,b)=>b.dist-a.dist);

  for(const p of visible){
    const sx=w/2+(p.rel/FOV)*w;
    const size=Math.min(h*1.05,h/(p.dist*.78));
    const col=Math.max(0,Math.min(w-1,Math.floor(sx)));
    if(depth[col]<p.dist-.1)continue;
    const y=horizon-size*.5;
    ctx.fillStyle="#080b12";
    ctx.fillRect(sx-size*.18,y-size*.04,size*.36,size*.08);
    ctx.fillStyle=p.id==="bot"?"#8b4dff":"#ff4059";
    ctx.beginPath();ctx.ellipse(sx,y+size*.15,size*.18,size*.27,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx,y-size*.04,size*.16,0,Math.PI*2);ctx.fillStyle=p.id==="bot"?"#b986ff":"#ff7888";ctx.fill();
    ctx.fillStyle="#151b25";ctx.fillRect(sx-size*.24,y+size*.42,size*.48,size*.08);
    ctx.fillStyle="#32e875";ctx.fillRect(sx-size*.23,y+size*.43,size*.46*(p.hp/100),size*.035);
    ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText(p.name,sx,y-size*.28);
  }

  for(const b of state.bullets||[]){
    const dx=b.x-meP.x,dy=b.y-meP.y,dist=Math.hypot(dx,dy);
    let rel=Math.atan2(dy,dx)-meP.angle;
    while(rel>Math.PI)rel-=Math.PI*2;while(rel<-Math.PI)rel+=Math.PI*2;
    if(Math.abs(rel)>FOV/2)continue;
    const sx=w/2+(rel/FOV)*w;
    const size=Math.max(2,Math.min(24,h/(dist*3)));
    const col=Math.max(0,Math.min(w-1,Math.floor(sx)));
    if(depth[col]<dist-.1)continue;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(sx,horizon,size,0,Math.PI*2);ctx.fill();
  }

  drawWeapon(w,h);
  
}

function drawWeapon(w,h){
  const sway=Math.sin(performance.now()/180)*2;
  const x=w*.5+55,y=h-100+sway;
  ctx.save();ctx.translate(x,y);ctx.rotate(-.03);
  ctx.fillStyle="#090b10";ctx.fillRect(-70,5,145,55);
  ctx.fillStyle="#252c38";ctx.fillRect(-55,-15,95,30);
  ctx.fillStyle="#11151d";ctx.fillRect(-5,-42,30,30);
  ctx.fillStyle="#303947";ctx.fillRect(-70,20,28,12);
  ctx.fillStyle="#171c25";ctx.fillRect(35,0,80,13);
  ctx.fillStyle="#0a0d12";ctx.fillRect(60,-5,55,8);
  ctx.restore();
}

function loop(t){
  lastFrame=t;
  if(running) drawScene();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
