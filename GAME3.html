<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIVALS — SchoolGame</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    user-select:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#070a10;
}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,rgba(50,80,130,.18),transparent 45%),
        linear-gradient(135deg,#05070b,#0b1018 50%,#030509);
}

.menuBox{
    width:min(440px,90vw);
    padding:34px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(7,10,16,.92);
    box-shadow:0 30px 100px rgba(0,0,0,.65);
    border-radius:18px;
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:6px;
}

.logo span{
    color:#ff3154;
}

.subtitle{
    color:#7f8da3;
    margin-bottom:28px;
    font-size:14px;
}

.input{
    width:100%;
    height:48px;
    border-radius:9px;
    border:1px solid #283345;
    background:#0d131d;
    color:white;
    padding:0 14px;
    outline:none;
    font-size:15px;
    margin-bottom:10px;
}

.input:focus{
    border-color:#ff3154;
}

.btn{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:9px;
    background:#e8274d;
    color:white;
    font-weight:800;
    cursor:pointer;
    margin-top:8px;
    transition:.15s;
}

.btn:hover{
    background:#ff3d60;
    transform:translateY(-1px);
}

.btn.secondary{
    background:#151d2a;
    border:1px solid #293548;
}

.btn.secondary:hover{
    background:#202b3c;
}

.small{
    margin-top:18px;
    color:#66748a;
    font-size:12px;
    line-height:1.5;
}

/* =========================
   LOBBY
========================= */

#lobby{
    position:fixed;
    inset:0;
    z-index:19;
    display:none;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 30%,rgba(55,85,130,.2),transparent 45%),
        #05070b;
}

.lobbyBox{
    width:min(520px,92vw);
    padding:32px;
    border-radius:18px;
    border:1px solid #202b3b;
    background:#090e16;
    text-align:center;
}

.roomCode{
    font-size:34px;
    font-weight:900;
    letter-spacing:7px;
    color:#ff3154;
    margin:15px 0;
}

.status{
    color:#8794a8;
    min-height:22px;
    margin-bottom:12px;
}

/* =========================
   HUD
========================= */

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

.topHud{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    min-width:310px;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(5,8,13,.68);
    backdrop-filter:blur(8px);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    font-size:13px;
}

.score{
    font-size:22px;
    font-weight:900;
}

.scoreRed{
    color:#ff3659;
}

.scoreBlue{
    color:#53a7ff;
}

.bottomHud{
    position:absolute;
    left:22px;
    right:22px;
    bottom:20px;
    display:flex;
    align-items:end;
    justify-content:space-between;
}

.hpBox,
.weaponBox{
    min-width:210px;
    padding:12px 15px;
    border-radius:12px;
    background:rgba(5,8,13,.76);
    border:1px solid rgba(255,255,255,.1);
}

.hpText{
    font-size:12px;
    color:#9aa7b9;
    margin-bottom:7px;
}

.hpBar{
    height:7px;
    background:#222a36;
    border-radius:10px;
    overflow:hidden;
}

#hpFill{
    height:100%;
    width:100%;
    background:#43df7b;
    transition:.15s;
}

.weaponName{
    font-weight:900;
    font-size:18px;
}

.ammo{
    color:#8897aa;
    font-size:12px;
    margin-top:4px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.9);
}

#crosshair::before{
    width:18px;
    height:2px;
    left:1px;
    top:9px;
}

#crosshair::after{
    width:2px;
    height:18px;
    left:9px;
    top:1px;
}

.crossDot{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    left:9px;
    top:9px;
}

#hitMarker{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    font-weight:900;
    opacity:0;
}

#hitMarker.show{
    animation:hit .2s ease-out;
}

@keyframes hit{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}
}

#damage{
    position:absolute;
    inset:0;
    background:radial-gradient(circle,transparent 40%,rgba(255,0,40,.45));
    opacity:0;
    pointer-events:none;
}

#damage.show{
    animation:damage .3s ease-out;
}

@keyframes damage{
    0%{opacity:1}
    100%{opacity:0}
}

#message{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    color:#d7deea;
    font-size:13px;
    text-shadow:0 2px 8px black;
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,4,7,.82);
    backdrop-filter:blur(7px);
}

.overBox{
    width:min(420px,90vw);
    text-align:center;
    padding:36px;
    border-radius:18px;
    background:#090d14;
    border:1px solid #252f40;
}

.overTitle{
    font-size:40px;
    font-weight:900;
    margin-bottom:12px;
}

.overWinner{
    color:#9aa8bb;
    margin-bottom:22px;
}

/* =========================
   MOBILE WARNING
========================= */

#desktopWarning{
    display:none;
}

@media(max-width:700px){
    #desktopWarning{
        display:block;
        position:fixed;
        z-index:100;
        inset:0;
        background:#05070b;
        color:white;
        text-align:center;
        padding:30px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- MENU -->
<div id="menu">
    <div class="menuBox">
        <div class="logo">RIV<span>AL</span>S</div>
        <div class="subtitle">SCHOOLGAME ONLINE FPS</div>

        <input
            id="nameInput"
            class="input"
            maxlength="14"
            placeholder="მოთამაშის სახელი"
        >

        <input
            id="roomInput"
            class="input"
            maxlength="8"
            placeholder="ოთახის კოდი — მეგობართან სათამაშოდ"
        >

        <button class="btn" id="createBtn">
            CREATE ROOM
        </button>

        <button class="btn secondary" id="joinBtn">
            JOIN ROOM
        </button>

        <button class="btn secondary" id="botBtn">
            PLAY WITH BOT
        </button>

        <div class="small">
            WASD — მოძრაობა<br>
            Mouse — დამიზნება<br>
            Left Click / Space — სროლა<br>
            ESC — მაუსის გათავისუფლება
        </div>
    </div>
</div>

<!-- LOBBY -->
<div id="lobby">
    <div class="lobbyBox">
        <div class="subtitle">ROOM</div>

        <div id="roomCode" class="roomCode">----</div>

        <div id="lobbyStatus" class="status">
            ველოდებით მოთამაშეს...
        </div>

        <button class="btn" id="addBotBtn">
            ADD BOT
        </button>

        <button class="btn secondary" id="backBtn">
            BACK
        </button>
    </div>
</div>

<!-- HUD -->
<div id="hud">

    <div class="topHud">
        <span id="p1Name">PLAYER</span>

        <span class="score">
            <span id="p1Score" class="scoreRed">0</span>
            :
            <span id="p2Score" class="scoreBlue">0</span>
        </span>

        <span id="p2Name">ENEMY</span>
    </div>

    <div id="message"></div>

    <div id="crosshair">
        <div class="crossDot"></div>
    </div>

    <div id="hitMarker">×</div>
    <div id="damage"></div>

    <div class="bottomHud">

        <div class="hpBox">
            <div class="hpText">
                HP <span id="hpValue">100</span>
            </div>

            <div class="hpBar">
                <div id="hpFill"></div>
            </div>
        </div>

        <div class="weaponBox">
            <div class="weaponName">RIFLE</div>
            <div class="ammo">
                LEFT CLICK / SPACE — FIRE
            </div>
        </div>

    </div>
</div>

<!-- GAME OVER -->
<div id="gameOver">
    <div class="overBox">

        <div id="overTitle" class="overTitle">
            GAME OVER
        </div>

        <div id="overWinner" class="overWinner">
            ---
        </div>

        <button class="btn" id="restartBtn">
            PLAY AGAIN
        </button>

        <button class="btn secondary" id="menuBtn">
            MAIN MENU
        </button>

    </div>
</div>

<div id="desktopWarning">
    RIVALS-ის სათამაშოდ გამოიყენე კომპიუტერი.
</div>

<script>
/* =========================================================
   SERVER
========================================================= */

const SERVER_URL =
    "wss://schoolgame-rivals.onrender.com";

let socket = null;
let playerId = null;
let roomCode = "";
let playerName = "";

let gameStarted = false;
let localPlayer = null;
let remotePlayers = {};
let bullets = [];

let score = {
    p1: 0,
    p2: 0
};

/* =========================================================
   DOM
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const lobby = document.getElementById("lobby");
const hud = document.getElementById("hud");
const gameOver = document.getElementById("gameOver");

const nameInput = document.getElementById("nameInput");
const roomInput = document.getElementById("roomInput");

const roomCodeEl = document.getElementById("roomCode");
const lobbyStatus = document.getElementById("lobbyStatus");

const p1NameEl = document.getElementById("p1Name");
const p2NameEl = document.getElementById("p2Name");

const p1ScoreEl = document.getElementById("p1Score");
const p2ScoreEl = document.getElementById("p2Score");

const hpValue = document.getElementById("hpValue");
const hpFill = document.getElementById("hpFill");

const hitMarker = document.getElementById("hitMarker");
const damage = document.getElementById("damage");
const messageEl = document.getElementById("message");

const overTitle = document.getElementById("overTitle");
const overWinner = document.getElementById("overWinner");

/* =========================================================
   CANVAS
========================================================= */

let W = 0;
let H = 0;
let renderScale = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    const maxWidth = 1250;
    const minWidth = 620;

    let target = Math.min(W, maxWidth);

    if(target < minWidth){
        target = minWidth;
    }

    renderScale = target / W;

    canvas.width = Math.floor(W * renderScale);
    canvas.height = Math.floor(H * renderScale);

    ctx.imageSmoothingEnabled = true;
}

window.addEventListener("resize", resize);
resize();

/* =========================================================
   ORIGINAL ARENA MAP
   1 = WALL
   0 = FLOOR

   Inspired by compact modular FPS arenas:
   central combat area,
   side corridors,
   cover,
   choke points,
   raised-looking structures.
========================================================= */

const MAP = [

"111111111111111111111111111111",
"100000000000000000000000000001",
"100011111000000000000111110001",
"100010001000000000000100010001",
"100010001000111111100100010001",
"100000000000100000100000000001",
"100000000000100000100000000001",
"100011000000100000100000110001",
"100011000000100000100000110001",
"100000000000000000000000000001",
"100000000011111111110000000001",
"100000000010000000010000000001",
"100000000010000000010000000001",
"100011000010000000010001100001",
"100011000010000000010001100001",
"100000000010000000010000000001",
"100000000011111111110000000001",
"100000000000000000000000000001",
"100001100000111111000001100001",
"100001100000100001000001100001",
"100000000000100001000000000001",
"100000000000000000000000000001",
"100011111000000000000111110001",
"100010001000000000000100010001",
"100010001000111111100100010001",
"100000000000100000100000000001",
"100000000000100000100000000001",
"100011000000100000100000110001",
"100011000000100000100000110001",
"111111111111111111111111111111"

];

const TILE = 1;

const MAP_H = MAP.length;
const MAP_W = MAP[0].length;

/* =========================================================
   FPS
========================================================= */

const FOV = Math.PI / 3;

function normalizeAngle(a){

    while(a < -Math.PI){
        a += Math.PI * 2;
    }

    while(a > Math.PI){
        a -= Math.PI * 2;
    }

    return a;
}

function isWall(x,y){

    const gx = Math.floor(x);
    const gy = Math.floor(y);

    if(gx < 0 || gy < 0 || gx >= MAP_W || gy >= MAP_H){
        return true;
    }

    return MAP[gy][gx] === "1";
}

/* =========================================================
   RAYCAST
========================================================= */

function castRay(px,py,angle){

    const rayDirX = Math.cos(angle);
    const rayDirY = Math.sin(angle);

    let mapX = Math.floor(px);
    let mapY = Math.floor(py);

    const deltaDistX =
        Math.abs(1 / (rayDirX || 0.000001));

    const deltaDistY =
        Math.abs(1 / (rayDirY || 0.000001));

    let stepX;
    let stepY;

    let sideDistX;
    let sideDistY;

    if(rayDirX < 0){

        stepX = -1;
        sideDistX =
            (px - mapX) * deltaDistX;

    }else{

        stepX = 1;
        sideDistX =
            (mapX + 1 - px) * deltaDistX;
    }

    if(rayDirY < 0){

        stepY = -1;
        sideDistY =
            (py - mapY) * deltaDistY;

    }else{

        stepY = 1;
        sideDistY =
            (mapY + 1 - py) * deltaDistY;
    }

    let side = 0;

    for(let i=0;i<80;i++){

        if(sideDistX < sideDistY){

            sideDistX += deltaDistX;
            mapX += stepX;
            side = 0;

        }else{

            sideDistY += deltaDistY;
            mapY += stepY;
            side = 1;
        }

        if(
            mapY < 0 ||
            mapY >= MAP_H ||
            mapX < 0 ||
            mapX >= MAP_W
        ){
            return {
                distance:50,
                side:0,
                mapX,
                mapY
            };
        }

        if(MAP[mapY][mapX] === "1"){

            let distance;

            if(side === 0){

                distance =
                    (mapX - px + (1-stepX)/2) /
                    rayDirX;

            }else{

                distance =
                    (mapY - py + (1-stepY)/2) /
                    rayDirY;
            }

            return {
                distance:Math.max(.0001,distance),
                side,
                mapX,
                mapY
            };
        }
    }

    return {
        distance:50,
        side:0,
        mapX,
        mapY
    };
}

/* =========================================================
   DRAW SKY
========================================================= */

function drawSky(){

    const g = ctx.createLinearGradient(
        0,
        0,
        0,
        H * .55
    );

    g.addColorStop(0,"#07101e");
    g.addColorStop(.45,"#101c2d");
    g.addColorStop(1,"#243344");

    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H*.55);

    /* distant light */

    const sun = ctx.createRadialGradient(
        W*.55,
        H*.25,
        10,
        W*.55,
        H*.25,
        H*.4
    );

    sun.addColorStop(0,"rgba(130,170,210,.14)");
    sun.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = sun;
    ctx.fillRect(0,0,W,H*.6);
}

/* =========================================================
   FLOOR
========================================================= */

function drawFloor(){

    const horizon = H * .51;

    const floorGradient =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    floorGradient.addColorStop(0,"#28333b");
    floorGradient.addColorStop(.35,"#1b252c");
    floorGradient.addColorStop(1,"#090d12");

    ctx.fillStyle = floorGradient;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    /*
       Large floor perspective strips.
    */

    ctx.save();

    ctx.globalAlpha = .25;

    for(let i=1;i<=24;i++){

        const t = i / 24;
        const y =
            horizon +
            Math.pow(t,1.65) *
            (H-horizon);

        ctx.strokeStyle =
            i % 2 === 0
            ? "#73808a"
            : "#3d474f";

        ctx.lineWidth =
            i < 8 ? 1 : 2;

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    /*
       Perspective longitudinal lines.
    */

    for(let i=-12;i<=12;i++){

        const bottomX =
            W/2 + i * W*.095;

        ctx.strokeStyle = "#65717a";
        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(
            W/2 + i * 7,
            horizon
        );

        ctx.lineTo(
            bottomX,
            H
        );

        ctx.stroke();
    }

    ctx.restore();

    /*
       Floor center illumination.
    */

    const light =
        ctx.createRadialGradient(
            W*.5,
            H*.78,
            20,
            W*.5,
            H*.78,
            W*.65
        );

    light.addColorStop(
        0,
        "rgba(120,150,170,.10)"
    );

    light.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = light;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );
}

/* =========================================================
   WALLS
========================================================= */

function drawWalls(){

    const columns =
        Math.min(
            canvas.width,
            1100
        );

    const columnWidth =
        canvas.width / columns;

    for(let x=0;x<columns;x++){

        const cameraX =
            (x / columns) * 2 - 1;

        const rayAngle =
            localPlayer.angle +
            cameraX * FOV/2;

        const hit =
            castRay(
                localPlayer.x,
                localPlayer.y,
                rayAngle
            );

        let distance =
            hit.distance *
            Math.cos(
                rayAngle-localPlayer.angle
            );

        distance =
            Math.max(.05,distance);

        const wallHeight =
            Math.min(
                canvas.height*2,
                canvas.height * .88 / distance
            );

        const top =
            canvas.height*.51 -
            wallHeight/2;

        /*
           Wall base shade.
        */

        let shade =
            1 -
            Math.min(
                .82,
                distance / 15
            );

        if(hit.side === 1){
            shade *= .78;
        }

        /*
           Different wall tones according
           to map position.
        */

        let r = 70;
        let g = 82;
        let b = 91;

        if((hit.mapX + hit.mapY) % 4 === 0){
            r = 78;
            g = 91;
            b = 100;
        }

        r = Math.floor(r * (.45 + shade*.55));
        g = Math.floor(g * (.45 + shade*.55));
        b = Math.floor(b * (.45 + shade*.55));

        ctx.fillStyle =
            `rgb(${r},${g},${b})`;

        ctx.fillRect(
            x,
            top,
            columnWidth+1,
            wallHeight
        );

        /*
           Top light edge.
        */

        if(wallHeight > 12){

            ctx.fillStyle =
                `rgba(180,200,215,${.08 + shade*.10})`;

            ctx.fillRect(
                x,
                top,
                columnWidth+1,
                2
            );
        }

        /*
           Wall vertical panels.
        */

        if(
            x % Math.max(8,Math.floor(columns/80))
            === 0
        ){

            ctx.fillStyle =
                `rgba(0,0,0,${.10 + (1-shade)*.18})`;

            ctx.fillRect(
                x,
                top,
                1,
                wallHeight
            );
        }
    }
}

/* =========================================================
   3D BILLBOARD OBJECTS
========================================================= */

function projectObject(x,y){

    const dx = x - localPlayer.x;
    const dy = y - localPlayer.y;

    const distance =
        Math.sqrt(dx*dx + dy*dy);

    let angle =
        normalizeAngle(
            Math.atan2(dy,dx) -
            localPlayer.angle
        );

    if(Math.abs(angle) > FOV*.7){
        return null;
    }

    const corrected =
        distance *
        Math.cos(angle);

    if(corrected <= .1){
        return null;
    }

    const screenX =
        canvas.width/2 +
        Math.tan(angle) /
        Math.tan(FOV/2) *
        canvas.width/2;

    return {
        distance:corrected,
        screenX
    };
}

/* =========================================================
   COVER OBJECTS
========================================================= */

const DECOR = [
    {x:6.5,y:6.5,w:1.2,h:1.2},
    {x:23.5,y:6.5,w:1.2,h:1.2},

    {x:6.5,y:23.5,w:1.2,h:1.2},
    {x:23.5,y:23.5,w:1.2,h:1.2},

    {x:10.5,y:9.5,w:1.0,h:1.0},
    {x:19.5,y:9.5,w:1.0,h:1.0},

    {x:10.5,y:20.5,w:1.0,h:1.0},
    {x:19.5,y:20.5,w:1.0,h:1.0}
];

function drawDecor(){

    const visible = [];

    for(const obj of DECOR){

        const p =
            projectObject(
                obj.x,
                obj.y
            );

        if(p){
            visible.push({
                ...obj,
                ...p
            });
        }
    }

    visible.sort(
        (a,b)=>b.distance-a.distance
    );

    for(const obj of visible){

        const size =
            canvas.height *
            .72 /
            obj.distance;

        const x =
            obj.screenX -
            size*.5;

        const y =
            canvas.height*.51 -
            size*.48;

        /*
           shadow
        */

        ctx.fillStyle =
            "rgba(0,0,0,.32)";

        ctx.fillRect(
            x-size*.08,
            y+size*.8,
            size*1.16,
            size*.14
        );

        /*
           main cover
        */

        const grad =
            ctx.createLinearGradient(
                x,
                y,
                x+size,
                y+size
            );

        grad.addColorStop(
            0,
            "#596873"
        );

        grad.addColorStop(
            .45,
            "#36434d"
        );

        grad.addColorStop(
            1,
            "#1a2229"
        );

        ctx.fillStyle = grad;

        ctx.fillRect(
            x,
            y,
            size,
            size*.82
        );

        /*
           top surface
        */

        ctx.fillStyle =
            "#778791";

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x+size*.16,
            y-size*.16
        );

        ctx.lineTo(
            x+size*1.05,
            y-size*.16
        );

        ctx.lineTo(
            x+size,
            y
        );

        ctx.closePath();

        ctx.fill();

        /*
           metal stripe
        */

        ctx.fillStyle =
            "rgba(220,230,235,.13)";

        ctx.fillRect(
            x+size*.15,
            y+size*.12,
            size*.7,
            size*.035
        );
    }
}

/* =========================================================
   PLAYER / BOT
========================================================= */

function drawCharacter(p){

    if(!p || !p.alive){
        return;
    }

    const pr =
        projectObject(
            p.x,
            p.y
        );

    if(!pr){
        return;
    }

    const size =
        canvas.height *
        .82 /
        pr.distance;

    const cx =
        pr.screenX;

    const baseY =
        canvas.height*.51 +
        size*.48;

    const head =
        size*.13;

    const bodyW =
        size*.23;

    const bodyH =
        size*.42;

    const bodyTop =
        baseY -
        bodyH -
        head*1.8;

    /*
       shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.38)";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        baseY+size*.02,
        size*.2,
        size*.055,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       legs
    */

    ctx.fillStyle =
        "#151a20";

    ctx.fillRect(
        cx-bodyW*.42,
        baseY-bodyH*.18,
        bodyW*.34,
        bodyH*.32
    );

    ctx.fillRect(
        cx+bodyW*.08,
        baseY-bodyH*.18,
        bodyW*.34,
        bodyH*.32
    );

    /*
       torso
    */

    const isBot =
        p.id === "bot" ||
        p.name === "BOT";

    const bodyColor =
        isBot
        ? "#7c38cf"
        : "#d92f4e";

    const torsoGrad =
        ctx.createLinearGradient(
            cx-bodyW/2,
            bodyTop,
            cx+bodyW/2,
            bodyTop
        );

    torsoGrad.addColorStop(
        0,
        bodyColor
    );

    torsoGrad.addColorStop(
        .55,
        isBot ? "#4b2580" : "#8e2038"
    );

    torsoGrad.addColorStop(
        1,
        "#11161c"
    );

    ctx.fillStyle = torsoGrad;

    ctx.fillRect(
        cx-bodyW/2,
        bodyTop,
        bodyW,
        bodyH
    );

    /*
       armor plate
    */

    ctx.fillStyle =
        "rgba(210,225,235,.17)";

    ctx.fillRect(
        cx-bodyW*.26,
        bodyTop+bodyH*.2,
        bodyW*.52,
        bodyH*.32
    );

    /*
       head
    */

    const headY =
        bodyTop -
        head*.85;

    ctx.fillStyle =
        "#c99b7d";

    ctx.beginPath();

    ctx.arc(
        cx,
        headY,
        head,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       helmet
    */

    ctx.fillStyle =
        isBot
        ? "#3e275b"
        : "#26313b";

    ctx.beginPath();

    ctx.arc(
        cx,
        headY-head*.12,
        head*1.02,
        Math.PI,
        0
    );

    ctx.fill();

    /*
       visor
    */

    ctx.fillStyle =
        isBot
        ? "#b874ff"
        : "#62b5ff";

    ctx.fillRect(
        cx-head*.66,
        headY-head*.03,
        head*1.32,
        head*.16
    );

    /*
       weapon
    */

    ctx.save();

    ctx.translate(
        cx+bodyW*.25,
        bodyTop+bodyH*.42
    );

    ctx.rotate(
        -.08
    );

    ctx.fillStyle =
        "#161b20";

    ctx.fillRect(
        0,
        0,
        bodyW*.9,
        head*.16
    );

    ctx.fillStyle =
        "#3e4850";

    ctx.fillRect(
        bodyW*.55,
        -head*.03,
        bodyW*.6,
        head*.09
    );

    ctx.restore();

    /*
       HP BAR
    */

    const barW =
        size*.48;

    const barH =
        Math.max(
            4,
            size*.025
        );

    const hp =
        Math.max(
            0,
            Math.min(
                100,
                Number(p.hp ?? 100)
            )
        );

    const barX =
        cx-barW/2;

    const barY =
        bodyTop -
        size*.16;

    ctx.fillStyle =
        "rgba(0,0,0,.65)";

    ctx.fillRect(
        barX,
        barY,
        barW,
        barH
    );

    ctx.fillStyle =
        hp > 50
        ? "#48df7b"
        : hp > 25
            ? "#f2c94c"
            : "#ff405c";

    ctx.fillRect(
        barX,
        barY,
        barW * hp/100,
        barH
    );

    /*
       Name
    */

    ctx.font =
        `${Math.max(9,size*.045)}px Arial`;

    ctx.textAlign = "center";

    ctx.fillStyle =
        "rgba(255,255,255,.86)";

    ctx.fillText(
        p.name || "PLAYER",
        cx,
        barY-size*.04
    );
}

/* =========================================================
   BULLETS
========================================================= */

function drawBullets(){

    for(const b of bullets){

        const p =
            projectObject(
                b.x,
                b.y
            );

        if(!p){
            continue;
        }

        const size =
            Math.max(
                2,
                15/p.distance
            );

        ctx.fillStyle =
            "#ffd76b";

        ctx.shadowColor =
            "#ff8a00";

        ctx.shadowBlur =
            12;

        ctx.beginPath();

        ctx.arc(
            p.screenX,
            canvas.height*.51,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

/* =========================================================
   WEAPON
========================================================= */

function drawWeapon(){

    const cx =
        canvas.width*.64;

    const base =
        canvas.height;

    const weaponW =
        canvas.width*.28;

    const weaponH =
        canvas.height*.34;

    /*
       arm
    */

    ctx.fillStyle =
        "#b9856d";

    ctx.beginPath();

    ctx.moveTo(
        cx-weaponW*.38,
        base
    );

    ctx.lineTo(
        cx-weaponW*.18,
        base-weaponH*.45
    );

    ctx.lineTo(
        cx+weaponW*.02,
        base-weaponH*.3
    );

    ctx.lineTo(
        cx-weaponW*.02,
        base
    );

    ctx.closePath();

    ctx.fill();

    /*
       rifle body
    */

    ctx.save();

    ctx.translate(
        cx,
        base-weaponH*.26
    );

    ctx.rotate(
        -.035
    );

    const rifleGrad =
        ctx.createLinearGradient(
            0,
            -weaponH*.18,
            0,
            weaponH*.18
        );

    rifleGrad.addColorStop(
        0,
        "#5b6870"
    );

    rifleGrad.addColorStop(
        .4,
        "#242c32"
    );

    rifleGrad.addColorStop(
        1,
        "#0b0e12"
    );

    ctx.fillStyle = rifleGrad;

    ctx.fillRect(
        -weaponW*.25,
        -weaponH*.09,
        weaponW*.55,
        weaponH*.18
    );

    /*
       receiver
    */

    ctx.fillStyle =
        "#151a1e";

    ctx.fillRect(
        -weaponW*.02,
        -weaponH*.15,
        weaponW*.32,
        weaponH*.25
    );

    /*
       barrel
    */

    ctx.fillStyle =
        "#080b0e";

    ctx.fillRect(
        weaponW*.22,
        -weaponH*.045,
        weaponW*.48,
        weaponH*.075
    );

    /*
       sight
    */

    ctx.fillStyle =
        "#65727a";

    ctx.fillRect(
        weaponW*.04,
        -weaponH*.19,
        weaponW*.12,
        weaponH*.05
    );

    /*
       magazine
    */

    ctx.fillStyle =
        "#0d1115";

    ctx.beginPath();

    ctx.moveTo(
        -weaponW*.03,
        weaponH*.08
    );

    ctx.lineTo(
        weaponW*.08,
        weaponH*.08
    );

    ctx.lineTo(
        weaponW*.13,
        weaponH*.28
    );

    ctx.lineTo(
        -weaponW*.02,
        weaponH*.24
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   VIGNETTE
========================================================= */

function drawVignette(){

    const v =
        ctx.createRadialGradient(
            W/2,
            H/2,
            H*.18,
            W/2,
            H/2,
            H*.78
        );

    v.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    v.addColorStop(
        .72,
        "rgba(0,0,0,.12)"
    );

    v.addColorStop(
        1,
        "rgba(0,0,0,.62)"
    );

    ctx.fillStyle = v;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}

/* =========================================================
   RENDER
========================================================= */

function render(){

    requestAnimationFrame(render);

    if(!gameStarted || !localPlayer){
        return;
    }

    /*
       Draw using canvas resolution.
    */

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawSky();
    drawFloor();
    drawWalls();

    /*
       Draw objects from far to near.
    */

    drawDecor();

    const chars = [];

    if(localPlayer){
        chars.push(localPlayer);
    }

    for(const id in remotePlayers){
        chars.push(remotePlayers[id]);
    }

    chars.sort((a,b)=>{

        const da =
            (a.x-localPlayer.x)**2 +
            (a.y-localPlayer.y)**2;

        const db =
            (b.x-localPlayer.x)**2 +
            (b.y-localPlayer.y)**2;

        return db-da;
    });

    for(const p of chars){
        if(p.id !== localPlayer.id){
            drawCharacter(p);
        }
    }

    drawBullets();
    drawWeapon();
    drawVignette();
}

render();

/* =========================================================
   INPUT
========================================================= */

const keys = {
    w:false,
    a:false,
    s:false,
    d:false
};

let mouseDown = false;
let mouseLocked = false;

document.addEventListener("keydown",(e)=>{

    const key =
        e.key.toLowerCase();

    if(key === "w"){
        keys.w = true;
    }

    if(key === "a"){
        keys.a = true;
    }

    if(key === "s"){
        keys.s = true;
    }

    if(key === "d"){
        keys.d = true;
    }

    if(e.code === "Space"){
        e.preventDefault();

        if(gameStarted){
            shoot();
        }
    }
});

document.addEventListener("keyup",(e)=>{

    const key =
        e.key.toLowerCase();

    if(key === "w"){
        keys.w = false;
    }

    if(key === "a"){
        keys.a = false;
    }

    if(key === "s"){
        keys.s = false;
    }

    if(key === "d"){
        keys.d = false;
    }
});

canvas.addEventListener("mousedown",(e)=>{

    if(!gameStarted){
        return;
    }

    if(e.button === 0){

        mouseDown = true;

        shoot();

        if(document.pointerLockElement !== canvas){

            canvas.requestPointerLock().catch(()=>{});
        }
    }
});

document.addEventListener("mouseup",(e)=>{

    if(e.button === 0){
        mouseDown = false;
    }
});

document.addEventListener(
    "pointerlockchange",
    ()=>{
        mouseLocked =
            document.pointerLockElement === canvas;
    }
);

document.addEventListener("mousemove",(e)=>{

    if(!gameStarted || !mouseLocked){
        return;
    }

    if(!localPlayer){
        return;
    }

    localPlayer.angle +=
        e.movementX * 0.0028;

    localPlayer.angle =
        normalizeAngle(
            localPlayer.angle
        );
});

/* =========================================================
   SHOOT
========================================================= */

let lastShot = 0;

function shoot(){

    if(!socket){
        return;
    }

    if(socket.readyState !== WebSocket.OPEN){
        return;
    }

    if(!gameStarted || !localPlayer){
        return;
    }

    const now = performance.now();

    if(now-lastShot < 170){
        return;
    }

    lastShot = now;

    socket.send(
        JSON.stringify({
            type:"shoot"
        })
    );
}

   SEND INPUT
========================================================= */

setInterval(()=>{

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN ||
        !gameStarted ||

    ){

    socket.send(

},50);

/* =========================================================
   WEBSOCKET
========================================================= */

function connect(){

    if(socket){
        try{
            socket.close();
        }catch(e){}
    }

    lobbyStatus.textContent =
        "სერვერთან დაკავშირება...";

    socket =
        new WebSocket(
            SERVER_URL
        );

    socket.onopen = ()=>{

        lobbyStatus.textContent =
            "დაკავშირებულია";
    };

    socket.onclose = ()=>{

        if(gameStarted){
            messageEl.textContent =
                "სერვერთან კავშირი გაწყდა";
        }else{
            lobbyStatus.textContent =
                "კავშირი გაწყდა";
        }
    };

    socket.onerror = ()=>{

        lobbyStatus.textContent =
            "სერვერთან დაკავშირება ვერ მოხერხდა";
    };

    socket.onmessage = (event)=>{

        let data;

        try{
            data =
                JSON.parse(event.data);
        }catch(e){
            return;
        }

        handleServerMessage(data);
    };
}

/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleServerMessage(data){

    switch(data.type){

        case "room_created":

            roomCode =
                data.room || "";

            playerId =
                data.playerId || null;

            roomCodeEl.textContent =
                roomCode;

            lobbyStatus.textContent =
                "ოთახი შეიქმნა. დაელოდე მეორე მოთამაშეს ან დაამატე BOT.";

            menu.style.display = "none";
            lobby.style.display = "flex";

            break;


        case "room_joined":

            roomCode =
                data.room || roomCode;

            playerId =
                data.playerId || playerId;

            roomCodeEl.textContent =
                roomCode;

            menu.style.display = "none";
            lobby.style.display = "flex";

            lobbyStatus.textContent =
                "ოთახში შეხვედი.";

            break;


        case "bot_joined":

            lobby.style.display = "none";

            startGame();

            messageEl.textContent =
                "BOT შემოვიდა ბრძოლაში";

            break;


        case "bot_left":

            delete remotePlayers.bot;

            messageEl.textContent =
                "BOT გავიდა";

            break;


        case "state":

            updateState(data);

            break;


        case "hit":

            showHit();

            break;


        case "damaged":

            showDamage();

            break;


        case "message":

            messageEl.textContent =
                data.message || "";

            break;


        case "game_over":

            showGameOver(
                data.winner
            );

            break;
    }
}

/* =========================================================
   STATE
========================================================= */

function updateState(data){

    if(!gameStarted){
        startGame();
    }

    const players =
        Array.isArray(data.players)
        ? data.players
        : [];

    remotePlayers = {};

    for(const p of players){

        if(p.id === playerId){

            localPlayer = {
                ...p
            };

        }else{

            remotePlayers[p.id] = {
                ...p
            };
        }
    }

    /*
       Optional bot object.
    */

    if(data.bot){

        const bot = {
            ...data.bot,
            id:"bot"
        };

        remotePlayers.bot = bot;
    }

    bullets =
        Array.isArray(data.bullets)
        ? data.bullets
        : [];

    if(data.score){

        score.p1 =
            Number(data.score.p1 || 0);

        score.p2 =
            Number(data.score.p2 || 0);
    }

    updateHUD();

    /*
       Lobby detection.
    */

    if(
        data.lobby === true &&
        !gameStarted
    ){
        lobby.style.display = "flex";
    }
}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    gameStarted = true;

    menu.style.display = "none";
    lobby.style.display = "none";
    gameOver.style.display = "none";
    hud.style.display = "block";

    messageEl.textContent =
        "WASD მოძრაობა • CLICK სროლა";

    setTimeout(()=>{

        messageEl.textContent = "";

    },3000);

    canvas.requestPointerLock?.().catch(()=>{});
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(!localPlayer){
        return;
    }

    const hp =
        Math.max(
            0,
            Math.min(
                100,
                Number(localPlayer.hp ?? 100)
            )
        );

    hpValue.textContent =
        Math.round(hp);

    hpFill.style.width =
        hp + "%";

    if(hp > 60){

        hpFill.style.background =
            "#43df7b";

    }else if(hp > 30){

        hpFill.style.background =
            "#f2c94c";

    }else{

        hpFill.style.background =
            "#ff405c";
    }

    p1ScoreEl.textContent =
        score.p1;

    p2ScoreEl.textContent =
        score.p2;

    p1NameEl.textContent =
        localPlayer.name ||
        playerName ||
        "PLAYER";

    const enemies =
        Object.values(
            remotePlayers
        );

    if(enemies.length){

        p2NameEl.textContent =
            enemies[0].name ||
            "ENEMY";

    }else{

        p2NameEl.textContent =
            "ENEMY";
    }
}

/* =========================================================
   EFFECTS
========================================================= */

function showHit(){

    hitMarker.classList.remove("show");

    void hitMarker.offsetWidth;

    hitMarker.classList.add("show");
}

function showDamage(){

    damage.classList.remove("show");

    void damage.offsetWidth;

    damage.classList.add("show");
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(winner){

    gameStarted = false;

    try{
        document.exitPointerLock();
    }catch(e){}

    hud.style.display = "none";
    gameOver.style.display = "flex";

    if(
        winner &&
        (
            winner === playerId ||
            winner === localPlayer?.id
        )
    ){

        overTitle.textContent =
            "YOU WIN";

        overTitle.style.color =
            "#43df7b";

    }else{

        overTitle.textContent =
            "YOU LOSE";

        overTitle.style.color =
            "#ff405c";
    }

    overWinner.textContent =
        winner
        ? "Winner: " + winner
        : "რაუნდი დასრულდა";
}

    }else{

        createRoomThenBot();
    }
});

function createRoomThenBot(){

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        return;
    }

    socket.send(
        JSON.stringify({
            type:"create_room",
            name:playerName
        })
    );

    setTimeout(()=>{

        if(
            socket &&
            socket.readyState === WebSocket.OPEN
        ){

            socket.send(
                JSON.stringify({
                    type:"add_bot"
                })
            );
        }

    },500);
}

document.getElementById("addBotBtn")
.addEventListener("click",()=>{

    if(
        socket &&
        socket.readyState === WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify({
                type:"add_bot"
            })
        );
    }
});

/* =========================================================
   BACK
========================================================= */

document.getElementById("backBtn")
.addEventListener("click",()=>{

    try{
        socket?.close();
    }catch(e){}

    socket = null;

    lobby.style.display = "none";
    menu.style.display = "flex";
});

/* =========================================================
   RESTART
========================================================= */

document.getElementById("restartBtn")
.addEventListener("click",()=>{

    gameOver.style.display = "none";

    gameStarted = true;

    hud.style.display = "block";

    if(
        socket &&
        socket.readyState === WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify({
                type:"restart_match"
            })
        );
    }

    setTimeout(()=>{

        canvas.requestPointerLock?.().catch(()=>{});

    },100);
});

/* =========================================================
   MAIN MENU
========================================================= */

document.getElementById("menuBtn")
.addEventListener("click",()=>{

    gameOver.style.display = "none";
    hud.style.display = "none";

    menu.style.display = "flex";

    gameStarted = false;

    try{
        document.exitPointerLock();
    }catch(e){}
});

/* =========================================================
   CONNECT ON LOAD
========================================================= */

connect();

/* =========================================================
   INITIAL CAMERA
========================================================= */

localPlayer = {
    id:"local",
    x:5.5,
    y:15.5,
    angle:0,
    hp:100,
    alive:true,
    name:"PLAYER"
};

/* =========================================================
   RESPAWN-SAFE RENDER DATA
========================================================= */

setInterval(()=>{

    if(!gameStarted){
        return;
    }

    if(localPlayer){

        /*
           The server is authoritative.
           This is only a visual fallback so the
           renderer never receives invalid values.
        */

        if(!Number.isFinite(localPlayer.x)){
            localPlayer.x = 5.5;
        }

        if(!Number.isFinite(localPlayer.y)){
            localPlayer.y = 15.5;
        }

        if(!Number.isFinite(localPlayer.angle)){
            localPlayer.angle = 0;
        }
    }

},250);

/* =========================================================
   KEEP SHOOTING WHILE HELD
========================================================= */

setInterval(()=>{

    if(
        mouseDown &&
        gameStarted
    ){
        shoot();
    }

},80);

</script>

</body>
</html>
