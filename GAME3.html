<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIVALS | SchoolGame</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    user-select:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

.hidden{
    display:none!important;
}

#menu,
#lobby,
#gameOver{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,rgba(40,60,100,.18),transparent 50%),
        linear-gradient(135deg,#04060a,#0b1019,#030406);
}

.panel{
    width:min(500px,92vw);
    padding:35px;
    border-radius:18px;
    text-align:center;
    background:rgba(8,11,18,.96);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 80px rgba(0,0,0,.7);
}

.logo{
    font-size:46px;
    font-weight:900;
    letter-spacing:4px;
}

.sub{
    margin-top:8px;
    margin-bottom:25px;
    color:#8792a3;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.12);
    background:#0c1119;
    color:white;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#e8edf5;
    color:#05070b;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

button:hover{
    background:white;
}

button.secondary{
    background:#161d29;
    color:white;
    border:1px solid rgba(255,255,255,.1);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.info{
    margin-top:20px;
    color:#687486;
    font-size:12px;
    line-height:1.7;
}

#loading{
    position:fixed;
    z-index:100;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:15px 22px;
    border-radius:10px;
    background:rgba(0,0,0,.9);
    color:white;
    font-weight:bold;
    display:none;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#topHud{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

#score{
    font-size:25px;
    font-weight:900;
    text-shadow:0 3px 15px black;
}

#status{
    color:#a8b2c0;
    font-size:12px;
    margin-top:5px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 5px rgba(255,255,255,.7);
}

#crosshair:before{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#crosshair:after{
    width:18px;
    height:2px;
    left:0;
    top:8px;
}

#healthBox{
    position:absolute;
    left:25px;
    bottom:25px;
    width:260px;
}

#healthText{
    font-weight:900;
    font-size:20px;
    margin-bottom:7px;
}

#healthBar{
    width:100%;
    height:12px;
    overflow:hidden;
    border-radius:20px;
    background:#191e26;
}

#healthFill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ff304f,#ff7650);
    transition:.15s;
}

#weaponBox{
    position:absolute;
    right:25px;
    bottom:20px;
    text-align:right;
}

#weaponName{
    font-size:24px;
    font-weight:900;
}

#ammo{
    color:#aeb7c3;
}

#hint{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.45);
    font-size:12px;
}

#hitMarker{
    position:absolute;
    left:50%;
    top:50%;
    width:34px;
    height:34px;
    transform:translate(-50%,-50%);
    opacity:0;
}

#hitMarker:before,
#hitMarker:after{
    content:"";
    position:absolute;
    inset:8px;
    border:2px solid white;
    transform:rotate(45deg);
}

#damageFlash{
    position:absolute;
    inset:0;
    background:rgba(255,0,30,.16);
    opacity:0;
}

#message{
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    font-size:40px;
    font-weight:900;
    opacity:0;
    text-shadow:0 5px 30px black;
}

@media(max-width:700px){
    #healthBox{
        left:12px;
        bottom:12px;
        width:180px;
    }

    #weaponBox{
        right:12px;
        bottom:12px;
    }

    #weaponName{
        font-size:18px;
    }

    .logo{
        font-size:34px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MENU -->

<div id="menu">

    <div class="panel">

        <div class="logo">
            RIVALS
        </div>

        <div class="sub">
            SCHOOLGAME FPS
        </div>

        <input
            id="nameInput"
            maxlength="16"
            placeholder="მოთამაშის სახელი"
        >

        <button id="createBtn">
            CREATE MATCH
        </button>

        <button
            id="joinBtn"
            class="secondary"
        >
            JOIN MATCH
        </button>

        <div class="info">
            WASD — მოძრაობა<br>

            მაუსი — კამერა<br>

    </div>

</div>


<!-- LOBBY -->

<div id="lobby" class="hidden">

    <div class="panel">

        <div
            class="logo"

        >

        </div>

        <div

        </div>

        </button>

        <button

        </button>

    </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="hidden">

    <div class="panel">

        <div
            id="gameOverTitle"
            class="logo"
            style="font-size:36px"
        >
            GAME OVER
        </div>

        <div
            id="gameOverText"
            class="sub"
        ></div>

        <button id="againBtn">
            PLAY AGAIN
        </button>

        <button
            id="menuBtn"
            class="secondary"
        >
            MENU
        </button>

    </div>

</div>


<!-- HUD -->

<div id="hud" class="hidden">

    <div id="topHud">

        <div id="score">
            0 : 0
        </div>

        <div id="status">
            CONNECTING
        </div>

    </div>

    <div id="crosshair"></div>

    <div id="hitMarker"></div>

    <div id="damageFlash"></div>

    <div id="message"></div>

    <div id="healthBox">

        <div id="healthText">
            100 HP
        </div>

        <div id="healthBar">

            <div id="healthFill"></div>

        </div>

    </div>

    <div id="weaponBox">

        <div id="weaponName">
            RIFLE
        </div>

        <div id="ammo">
            30 / ∞
        </div>

    </div>

    <div id="hint">
        CLICK TO LOCK MOUSE · WASD MOVE · SHIFT RUN · SPACE JUMP
    </div>

</div>


<div id="loading">
    Connecting...
</div>


<script>

/* =====================================================
   SERVER
===================================================== */

const SERVER_URL =
    "wss://schoolgame-rivals.onrender.com";


/* =====================================================
   STATE
===================================================== */

let socket = null;

let socketReady = false;

let pendingAction = null;

let roomCode = "";

let myId = null;

let myName = "Player";

let players = {};

let gameRunning = false;

let scoreA = 0;
let scoreB = 0;


/* =====================================================
   DOM
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const menu =
    document.getElementById("menu");

const lobby =
    document.getElementById("lobby");

const gameOver =
    document.getElementById("gameOver");

const hud =
    document.getElementById("hud");

const loading =
    document.getElementById("loading");

const nameInput =
    document.getElementById("nameInput");

const roomText =
    document.getElementById("roomText");

const scoreEl =
    document.getElementById("score");

const statusEl =
    document.getElementById("status");

const healthText =
    document.getElementById("healthText");

const healthFill =
    document.getElementById("healthFill");

const hitMarker =
    document.getElementById("hitMarker");

const damageFlash =
    document.getElementById("damageFlash");

const messageEl =
    document.getElementById("message");


/* =====================================================
   CANVAS
===================================================== */

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(
            2,
            window.devicePixelRatio || 1
        );

    canvas.width =
        Math.floor(W*dpr);

    canvas.height =
        Math.floor(H*dpr);

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   PLAYER
===================================================== */

let me = {

    x:13.5,
    y:13.5,

    z:0,

    vy:0,

    angle:0,

    hp:100,

    grounded:true
};


/* =====================================================
   INPUT
===================================================== */

const keys = {};

let mouseDown = false;

addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="ArrowDown" ||
            e.code==="ArrowLeft" ||
            e.code==="ArrowRight"
        ){
            e.preventDefault();
        }

        if(e.code==="Space"){
            jump();
        }

    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "click",
    ()=>{

        if(!gameRunning)
            return;

        if(
            document.pointerLockElement !== canvas
        ){

            canvas.requestPointerLock()
                .catch(()=>{});

        }else{

            shoot();
        }
    }
);

canvas.addEventListener(
    "mousedown",
    e=>{

        if(e.button===0){

            mouseDown=true;

            if(
                document.pointerLockElement === canvas
            ){
                shoot();
            }
        }
    }
);

canvas.addEventListener(
    "mouseup",
    e=>{

        if(e.button===0){
            mouseDown=false;
        }
    }
);

document.addEventListener(
    "mousemove",
    e=>{

        if(!gameRunning)
            return;

        if(
            document.pointerLockElement !== canvas
        )
            return;

        me.angle +=
            e.movementX*.0028;
    }
);


/* =====================================================
   MAP
===================================================== */

const MAP = [

"111111111111111111111111111",
"100000000000000000000000001",
"100000000000000000000000001",
"100001111100000011111000001",
"100001000100000010001000001",
"100001000100000010001000001",
"100001000100000010001000001",
"100001000111111110001000001",
"100000000000000000000000001",
"100000002000000000200000001",
"100000000000000000000000001",
"100011111000000001111100001",
"100010000000000000000100001",
"100010000000000000000100001",
"100010000000000000000100001",
"100011111000000001111100001",
"100000000000000000000000001",
"100000020000000000002000001",
"100000000000000000000000001",
"100001111000000001111000001",
"100001001000000001001000001",
"100001001000000001001000001",
"100001001000000001001000001",
"100001111000000001111000001",
"100000000000000000000000001",
"100000000000000000000000001",
"111111111111111111111111111"

];

const MAP_W =
    MAP[0].length;

const MAP_H =
    MAP.length;


function cell(x,y){

    const xx =
        Math.floor(x);

    const yy =
        Math.floor(y);

    if(
        xx<0 ||
        yy<0 ||
        xx>=MAP_W ||
        yy>=MAP_H
    ){
        return "1";
    }

    return MAP[yy][xx];
}


function solid(x,y){

    const c =
        cell(x,y);

    return (
        c==="1" ||
        c==="2" ||
        c==="3" ||
        c==="4"
    );
}


function canMove(x,y){

    const r=.22;

    return (
        !solid(x-r,y-r) &&
        !solid(x+r,y-r) &&
        !solid(x-r,y+r) &&
        !solid(x+r,y+r)
    );
}


/* =====================================================
   MOVEMENT
===================================================== */

function jump(){

    if(
        gameRunning &&
        me.grounded
    ){

        me.vy=5.8;

        me.grounded=false;
    }
}


function updateMovement(dt){

    if(!gameRunning)
        return;

    let forward=0;
    let strafe=0;

    if(
        keys["KeyW"] ||
        keys["ArrowUp"]
    )
        forward++;

    if(
        keys["KeyS"] ||
        keys["ArrowDown"]
    )
        forward--;

    if(
        keys["KeyD"] ||
        keys["ArrowRight"]
    )
        strafe++;

    if(
        keys["KeyA"] ||
        keys["ArrowLeft"]
    )
        strafe--;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    if(length){

        forward/=length;
        strafe/=length;
    }

    let speed=3.5;

    if(
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
    ){
        speed=5.5;
    }

    const cos =
        Math.cos(me.angle);

    const sin =
        Math.sin(me.angle);

    const dx =
        (
            cos*forward -
            sin*strafe
        )*
        speed*
        dt;

    const dy =
        (
            sin*forward +
            cos*strafe
        )*
        speed*
        dt;

    if(
        canMove(
            me.x+dx,
            me.y
        )
    ){
        me.x+=dx;
    }

    if(
        canMove(
            me.x,
            me.y+dy
        )
    ){
        me.y+=dy;
    }

    me.vy -=
        14*dt;

    me.z +=
        me.vy*dt;

    if(me.z<=0){

        me.z=0;
        me.vy=0;
        me.grounded=true;
    }
}


/* =====================================================
   SERVER INPUT
===================================================== */

let inputTimer=0;

function sendInput(dt){

    inputTimer+=dt;

    if(inputTimer<.04)
        return;

    inputTimer=0;

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    )
        return;

    socket.send(
        JSON.stringify({

            type:"input",

            x:me.x,
            y:me.y,

            angle:me.angle,

            shooting:mouseDown,

            keys:{
                w:!!keys["KeyW"],
                a:!!keys["KeyA"],
                s:!!keys["KeyS"],
                d:!!keys["KeyD"]
            }
        })
    );
}


/* =====================================================
   SHOOT
===================================================== */

let lastShot=0;

function shoot(){

    if(!gameRunning)
        return;

    const now =
        performance.now();

    if(
        now-lastShot<105
    )
        return;

    lastShot=now;

    if(
        socket &&
        socket.readyState===WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify({

                type:"shoot",

                x:me.x,
                y:me.y,

                angle:me.angle
            })
        );
    }

    muzzle=.08;
}


/* =====================================================
   RAYCAST
===================================================== */

const FOV =
    Math.PI/3;


function castRay(angle){

    const sin =
        Math.sin(angle);

    const cos =
        Math.cos(angle);

    let mapX =
        Math.floor(me.x);

    let mapY =
        Math.floor(me.y);

    const deltaX =
        Math.abs(1/cos);

    const deltaY =
        Math.abs(1/sin);

    let stepX;
    let stepY;

    let sideX;
    let sideY;

    if(cos<0){

        stepX=-1;

        sideX =
            (me.x-mapX)*deltaX;

    }else{

        stepX=1;

        sideX =
            (mapX+1-me.x)*deltaX;
    }

    if(sin<0){

        stepY=-1;

        sideY =
            (me.y-mapY)*deltaY;

    }else{

        stepY=1;

        sideY =
            (mapY+1-me.y)*deltaY;
    }

    let side=0;

    for(let i=0;i<100;i++){

        if(sideX<sideY){

            sideX+=deltaX;
            mapX+=stepX;

            side=0;

        }else{

            sideY+=deltaY;
            mapY+=stepY;

            side=1;
        }

        if(
            mapX<0 ||
            mapY<0 ||
            mapX>=MAP_W ||
            mapY>=MAP_H
        )
            break;

        const c =
            MAP[mapY][mapX];

        if(
            c==="1" ||
            c==="2" ||
            c==="3" ||
            c==="4"
        ){

            const dist =
                side===0
                ? sideX-deltaX
                : sideY-deltaY;

            return {
                dist:Math.max(
                    .01,
                    dist
                ),
                cell:c,
                side
            };
        }
    }

    return {
        dist:50,
        cell:"0",
        side:0
    };
}


/* =====================================================
   DRAW
===================================================== */

function drawSky(){

    const g =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H/2
        );

    g.addColorStop(
        0,
        "#050912"
    );

    g.addColorStop(
        .55,
        "#121d2c"
    );

    g.addColorStop(
        1,
        "#2b3b4d"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H/2
    );
}


function drawFloor(){

    const g =
        ctx.createLinearGradient(
            0,
            H/2,
            0,
            H
        );

    g.addColorStop(
        0,
        "#202a35"
    );

    g.addColorStop(
        .45,
        "#111820"
    );

    g.addColorStop(
        1,
        "#05070a"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        H/2,
        W,
        H/2
    );

    ctx.save();

    ctx.globalAlpha=.18;

    ctx.strokeStyle="#75818e";

    for(let i=1;i<28;i++){

        const p =
            Math.pow(
                i/28,
                1.8
            );

        const y =
            H/2 +
            p*(H-H/2);

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }

    const center =
        W/2;

    for(
        let i=-18;
        i<=18;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            center,
            H/2
        );

        ctx.lineTo(
            center+i*100,
            H
        );

        ctx.stroke();
    }

    ctx.restore();
}


function drawWalls(){

    const rays =
        Math.min(
            1050,
            Math.max(
                520,
                W
            )
        );

    const step =
        W/rays;

    for(
        let x=0;
        x<W;
        x+=step
    ){

        const cameraX =
            x/W-.5;

        const angle =
            me.angle+
            cameraX*FOV;

        const ray =
            castRay(angle);

        const dist =
            ray.dist*
            Math.cos(
                angle-me.angle
            );

        const height =
            H/
            Math.max(
                .05,
                dist
            );

        let top =
            H/2-height/2;

        let bottom =
            H/2+height/2;

        if(ray.cell==="2")
            top-=height*.15;

        if(ray.cell==="3")
            top-=height*.5;

        const light =
            Math.max(
                .18,
                1-dist/16
            );

        let r=115;
        let g=125;
        let b=138;

        if(ray.cell==="2"){

            r=65;
            g=78;
            b=94;

        }else if(ray.cell==="3"){

            r=105;
            g=80;
            b=45;
        }

        if(ray.side){

            r*=.7;
            g*=.7;
            b*=.7;
        }

        r*=light;
        g*=light;
        b*=light;

        ctx.fillStyle=
            `rgb(${r|0},${g|0},${b|0})`;

        ctx.fillRect(
            x,
            top,
            step+1,
            bottom-top
        );
    }
}


/* =====================================================
   PLAYERS
===================================================== */

function worldToScreen(x,y){

    const dx=x-me.x;
    const dy=y-me.y;

    const dist =
        Math.hypot(
            dx,
            dy
        );

    let angle =
        Math.atan2(
            dy,
            dx
        )-
        me.angle;

    while(angle>Math.PI)
        angle-=Math.PI*2;

    while(angle<-Math.PI)
        angle+=Math.PI*2;

    if(
        Math.abs(angle)>FOV*.7
    )
        return null;

    const corrected =
        dist*Math.cos(angle);

    if(corrected<=.1)
        return null;

    const sx =
        W/2+
        Math.tan(angle)/
        Math.tan(FOV/2)*
        W/2;

    return {
        x:sx,
        dist:corrected
    };
}


function drawPlayers(){

    const list =
        Object.values(players);

    list.sort(
        (a,b)=>{

            const da =
                Math.hypot(
                    a.x-me.x,
                    a.y-me.y
                );

            const db =
                Math.hypot(
                    b.x-me.x,
                    b.y-me.y
                );

            return db-da;
        }
    );

    for(const p of list){

        if(p.id===myId)
            continue;

        if(
            p.hp!==undefined &&
            p.hp<=0
        )
            continue;

        const s =
            worldToScreen(
                p.x,
                p.y
            );

        if(!s)
            continue;

        const h =
            Math.min(
                500,
                H/s.dist
            );

        const w =
            h*.34;

        const bottom =
            H/2;

        const top =
            bottom-h;

        ctx.fillStyle=
            "rgba(0,0,0,.4)";

        ctx.beginPath();

        ctx.ellipse(
            s.x,
            bottom+4,
            w*.55,
            w*.15,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#181d24";

        ctx.fillRect(
            s.x-w*.3,
            top+h*.62,
            w*.2,
            h*.38
        );

        ctx.fillRect(
            s.x+w*.1,
            top+h*.62,
            w*.2,
            h*.38
        );

        ctx.fillStyle="#3c4856";

        ctx.fillRect(
            s.x-w*.42,
            top+h*.29,
            w*.84,
            h*.38
        );

        ctx.fillStyle="#b99e89";

        ctx.beginPath();

        ctx.arc(
            s.x,
            top+h*.18,
            w*.28,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#242b34";

        ctx.beginPath();

        ctx.arc(
            s.x,
            top+h*.13,
            w*.29,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#10151b";

        ctx.lineWidth=
            Math.max(
                2,
                w*.08
            );

        ctx.beginPath();

        ctx.moveTo(
            s.x+w*.15,
            top+h*.46
        );

        ctx.lineTo(
            s.x+w*.7,
            top+h*.5
        );

        ctx.stroke();

        if(s.dist<12){

            ctx.textAlign="center";

            ctx.font=
                "bold 12px Arial";

            ctx.fillStyle="white";

            ctx.fillText(
                p.name||"BOT",
                s.x,
                top-10
            );

            const hp =
                Math.max(
                    0,
                    Math.min(
                        100,
                        p.hp??100
                    )
                );

            ctx.fillStyle="#171b21";

            ctx.fillRect(
                s.x-25,
                top-6,
                50,
                4
            );

            ctx.fillStyle="#ef4053";

            ctx.fillRect(
                s.x-25,
                top-6,
                50*hp/100,
                4
            );
        }
    }
}


/* =====================================================
   WEAPON
===================================================== */

let muzzle=0;

function drawWeapon(){

    const moving =
        keys["KeyW"] ||
        keys["KeyA"] ||
        keys["KeyS"] ||
        keys["KeyD"];

    const bob =
        moving
        ? Math.sin(
            performance.now()/80
        )*5
        : 0;

    const gw =
        Math.min(
            430,
            W*.43
        );

    const gh =
        gw*.25;

    const x =
        W/2-gw*.15;

    const y =
        H-gh*.75+bob;

    ctx.save();

    ctx.fillStyle="#a88974";

    ctx.beginPath();

    ctx.ellipse(
        x+gw*.05,
        y+gh*.45,
        gw*.13,
        gh*.25,
        -.2,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#171c23";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y+gh*.25
    );

    ctx.lineTo(
        x+gw*.63,
        y+gh*.18
    );

    ctx.lineTo(
        x+gw*.88,
        y+gh*.45
    );

    ctx.lineTo(
        x+gw*.62,
        y+gh*.72
    );

    ctx.lineTo(
        x+gw*.28,
        y+gh*.68
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#080b0f";

    ctx.fillRect(
        x+gw*.58,
        y+gh*.34,
        gw*.4,
        gh*.14
    );

    ctx.fillStyle="#0c1117";

    ctx.fillRect(
        x+gw*.31,
        y+gh*.6,
        gw*.16,
        gh*.35
    );

    if(muzzle>0){

        ctx.fillStyle=
            "rgba(255,190,60,.9)";

        ctx.beginPath();

        ctx.moveTo(
            x+gw*.98,
            y+gh*.4
        );

        ctx.lineTo(
            x+gw*1.15,
            y+gh*.27
        );

        ctx.lineTo(
            x+gw*1.08,
            y+gh*.48
        );

        ctx.lineTo(
            x+gw*1.15,
            y+gh*.64
        );

        ctx.closePath();

        ctx.fill();
    }

    ctx.restore();
}


/* =====================================================
   EFFECTS
===================================================== */

let hitTimer=0;
let damageTimer=0;

function showHit(){

    hitTimer=.15;

    hitMarker.style.opacity="1";
}

function showDamage(){

    damageTimer=.18;

    damageFlash.style.opacity="1";
}

function showMessage(
    text,
    seconds=1
){

    messageEl.textContent=text;

    messageEl.style.opacity="1";

    setTimeout(
        ()=>{
            messageEl.style.opacity="0";
        },
        seconds*1000
    );
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    const hp =
        Math.max(
            0,
            Math.min(
                100,
                me.hp
            )
        );

    healthText.textContent =
        Math.round(hp)+" HP";

    healthFill.style.width =
        hp+"%";

    scoreEl.textContent =
        scoreA+" : "+scoreB;
}


/* =====================================================
   GAME LOOP
===================================================== */

let previous =
    performance.now();

function loop(now){

    const dt =
        Math.min(
            .05,
            (now-previous)/1000
        );

    previous=now;

    if(gameRunning){

        updateMovement(dt);

        sendInput(dt);

        muzzle-=dt;

        if(muzzle<0)
            muzzle=0;

        hitTimer-=dt;

        if(hitTimer<=0)
            hitMarker.style.opacity="0";

        damageTimer-=dt;

        if(damageTimer<=0)
            damageFlash.style.opacity="0";

        drawSky();
        drawFloor();
        drawWalls();
        drawPlayers();
        drawWeapon();

        updateHUD();

        if(mouseDown)
            shoot();
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =====================================================
   WEBSOCKET CONNECT
===================================================== */

function connect(){

    if(
        socket &&
        (
            socket.readyState===WebSocket.OPEN ||
            socket.readyState===WebSocket.CONNECTING
        )
    ){
        return;
    }

    loading.style.display="block";
    loading.textContent=
        "სერვერთან დაკავშირება...";

    statusEl.textContent=
        "CONNECTING";

    socketReady=false;

    try{

        socket =
            new WebSocket(
                SERVER_URL
            );

    }catch(error){

        loading.textContent=
            "SERVER ERROR";

        return;
    }

    socket.onopen=()=>{

        socketReady=true;

        loading.style.display="none";

        statusEl.textContent=
            "CONNECTED";

        /*
         * თუ ღილაკზე დაჭერისას სერვერი ჯერ
         * არ იყო მზად, აქ ავტომატურად
         * გავუშვებთ მოთხოვნას.
         */

        if(pendingAction){

            const action =
                pendingAction;

            pendingAction=null;

            setTimeout(
                ()=>{
                    action();
                },
                100
            );
        }
    };


    socket.onclose=()=>{

        socketReady=false;

        if(!gameRunning){

            statusEl.textContent=
                "OFFLINE";
        }else{

            statusEl.textContent=
                "DISCONNECTED";
        }

        /*
         * ავტომატური reconnect
         */

        setTimeout(
            ()=>{
                if(!socketReady){
                    connect();
                }
            },
            2000
        );
    };


    socket.onerror=()=>{

        loading.textContent=
            "სერვერთან დაკავშირება ვერ მოხერხდა";
    };


    socket.onmessage=
        event=>{

            let data;

            try{

                data=
                    JSON.parse(
                        event.data
                    );

            }catch{

                return;
            }

            handleServerMessage(data);
        };
}


/* =====================================================
   SEND
===================================================== */

function send(data){

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        return false;
    }

    try{

        socket.send(
            JSON.stringify(data)
        );

        return true;

    }catch{

        return false;
    }
}


/* =====================================================
   CREATE MATCH
===================================================== */

function createMatch(){

    myName =
        nameInput.value.trim() ||
        "Player";

    /*
     * თუ WebSocket ჯერ არ არის გახსნილი,
     * მოთხოვნას ვინახავთ.
     */

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){

        pendingAction=()=>{
            createMatch();
        };

        connect();

        loading.style.display="block";

        loading.textContent=
            "სერვერთან დაკავშირება...";

        return;
    }

    loading.style.display="block";

    loading.textContent=
        "MATCH იქმნება...";

    const ok =
        send({

            type:"create",

            name:myName
        });

    if(!ok){

        loading.textContent=
            "Create failed";

        return;
    }
}


/* =====================================================
   JOIN
===================================================== */

function joinMatch(){

    myName =
        nameInput.value.trim() ||
        "Player";

    const code =
        prompt(
            "შეიყვანე ROOM CODE:"
        );

    if(!code)
        return;

    roomCode =
        code.trim();

    function doJoin(){

        if(
            !socket ||
            socket.readyState !== WebSocket.OPEN
        ){

            pendingAction=doJoin;

            connect();

            return;
        }

        loading.style.display="block";

        loading.textContent=
            "MATCH-ში შესვლა...";

        send({

            type:"join",

            room:roomCode,

            name:myName
        });
    }

    doJoin();
}


/* =====================================================
   BOT
===================================================== */

function addBot(){

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){

        pendingAction=addBot;

        connect();

        return;
    }

    send({

        type:"add_bot"
    });
}


/* =====================================================
   SERVER MESSAGES
===================================================== */

function handleServerMessage(data){

    console.log(
        "SERVER:",
        data
    );

    switch(data.type){

        case "created":

        case "room_created":

        case "create_success":

            roomCode =
                data.room ||
                data.roomCode ||
                data.code ||
                "";

            openLobby();

            break;


        case "joined":

        case "join_success":

            roomCode =
                data.room ||
                data.roomCode ||
                data.code ||
                roomCode;

            openLobby();

            break;


        case "player_id":

        case "id":

            myId =
                data.id ||
                data.playerId;

            break;


        case "state":

            updateState(data);

            break;


        case "started":

        case "game_start":

        case "match_started":

            startGame();

            break;


        case "bot_joined":

            startGame();

            showMessage(
                "BOT JOINED",
                1
            );

            break;


        case "hit":

            showHit();

            break;


        case "damaged":

            showDamage();

            break;


        case "game_over":

        case "match_over":

            endGame(
                data.winner ||
                data.message ||
                "GAME OVER"
            );

            break;


        case "round_end":

            showMessage(
                data.message ||
                "ROUND END",
                1.5
            );

            break;


        case "message":

            if(data.message){

                showMessage(
                    data.message,
                    1.5
                );
            }

            break;


        case "error":

            loading.style.display="none";

            alert(
                data.message ||
                data.error ||
                "Server error"
            );

            break;
    }
}


/* =====================================================
   OPEN LOBBY
===================================================== */

function openLobby(){

    loading.style.display="none";

    menu.classList.add("hidden");

    gameOver.classList.add("hidden");

    lobby.classList.remove("hidden");

    roomText.textContent =
        roomCode
        ? "ROOM: "+roomCode
        : "ROOM CREATED";

    statusEl.textContent=
        "LOBBY";
}


/* =====================================================
   UPDATE STATE
===================================================== */

function updateState(data){

    const list =
        data.players ||
        [];

    players={};

    for(
        const p of list
    ){

        players[p.id]=p;

        if(
            p.id===myId
        ){

            if(
                Number.isFinite(p.hp)
            ){
                me.hp=p.hp;
            }

            if(
                Number.isFinite(p.x) &&
                Number.isFinite(p.y)
            ){

                const dx=
                    p.x-me.x;

                const dy=
                    p.y-me.y;

                /*
                 * მხოლოდ დიდი განსხვავებისას
                 * ვასწორებთ ლოკალურ პოზიციას,
                 * რომ მოძრაობა smooth დარჩეს.
                 */

                if(
                    Math.hypot(
                        dx,
                        dy
                    )>1.5
                ){

                    me.x=p.x;
                    me.y=p.y;
                }
            }
        }
    }

    if(
        Number.isFinite(data.scoreA)
    ){
        scoreA=
            data.scoreA;
    }

    if(
        Number.isFinite(data.scoreB)
    ){
        scoreB=
            data.scoreB;
    }
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    gameRunning=true;

    menu.classList.add("hidden");

    lobby.classList.add("hidden");

    gameOver.classList.add("hidden");

    hud.classList.remove("hidden");

    me.hp=100;

    statusEl.textContent=
        "FIGHT";

    showMessage(
        "FIGHT!",
        1
    );

    setTimeout(
        ()=>{
            if(gameRunning){

                canvas
                    .requestPointerLock()
                    .catch(
                        ()=>{}
                    );
            }
        },
        300
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(result){

    gameRunning=false;

    mouseDown=false;

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();
    }

    document
        .getElementById(
            "gameOverText"
        )
        .textContent=
            String(result);

    gameOver.classList.remove(
        "hidden"
    );
}


/* =====================================================
   BUTTONS
===================================================== */

document
.getElementById("createBtn")
.addEventListener(
    "click",
    createMatch
);


document
.getElementById("joinBtn")
.addEventListener(
    "click",
    joinMatch
);


document
.getElementById("botBtn")
.addEventListener(
    "click",
    addBot
);


document
.getElementById("copyBtn")
.addEventListener(
    "click",
    async()=>{

        if(!roomCode)
            return;

        try{

            await navigator
                .clipboard
                .writeText(
                    roomCode
                );

            roomText.textContent=
                "COPIED: "+roomCode;

            setTimeout(
                ()=>{
                    roomText.textContent=
                        "ROOM: "+roomCode;
                },
                1200
            );

        }catch{

            prompt(
                "Copy room code:",
                roomCode
            );
        }
    }
);


document
.getElementById("backBtn")
.addEventListener(
    "click",
    ()=>{

        lobby.classList.add(
            "hidden"
        );

        menu.classList.remove(
            "hidden"
        );
    }
);


document
.getElementById("againBtn")
.addEventListener(
    "click",
    ()=>{

        gameOver.classList.add(
            "hidden"
        );

        lobby.classList.remove(
            "hidden"
        );
    }
);


document
.getElementById("menuBtn")
.addEventListener(
    "click",
    ()=>{

        gameRunning=false;

        gameOver.classList.add(
            "hidden"
        );

        hud.classList.add(
            "hidden"
        );

        menu.classList.remove(
            "hidden"
        );
    }
);


/* =====================================================
   POINTER LOCK
===================================================== */

document.addEventListener(
    "pointerlockchange",
    ()=>{

        if(!gameRunning)
            return;

        if(
            document.pointerLockElement===
            canvas
        ){

            statusEl.textContent=
                "FIGHT";

        }else{

            statusEl.textContent=
                "CLICK TO PLAY";
        }
    }
);


/* =====================================================
   FOCUS
===================================================== */

addEventListener(
    "blur",
    ()=>{

        for(
            const key in keys
        ){
            keys[key]=false;
        }

        mouseDown=false;
    }
);


/* =====================================================
   AUTO CONNECT
===================================================== */

connect();


/* =====================================================
   AUTO SHOOT
===================================================== */

setInterval(
    ()=>{

        if(
            gameRunning &&
            mouseDown
        ){

            shoot();
        }

    },
    30
);

</script>
