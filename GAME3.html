<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIVALS | SchoolGame</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    user-select:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#080b12;
}

#menu,
#lobby,
#gameOver{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,rgba(35,50,80,.22),transparent 45%),
        linear-gradient(135deg,#05070b,#0a0e16 55%,#030406);
}

.panel{
    width:min(500px,92vw);
    padding:35px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(8,11,18,.94);
    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.04);
    border-radius:18px;
    text-align:center;
}

.logo{
    font-size:46px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:8px;
}

.sub{
    color:#8e9aaa;
    margin-bottom:30px;
}

button{
    width:100%;
    border:0;
    padding:15px 18px;
    margin-top:12px;
    border-radius:10px;
    background:#e8edf5;
    color:#05070b;
    font-weight:900;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:white;
}

button.secondary{
    background:#161d29;
    color:white;
    border:1px solid rgba(255,255,255,.1);
}

input{
    width:100%;
    padding:14px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.1);
    background:#0d121b;
    color:white;
    outline:none;
    margin-top:8px;
}

.hidden{
    display:none!important;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#topHud{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    min-width:240px;
    text-align:center;
}

#score{
    font-size:24px;
    font-weight:900;
    text-shadow:0 3px 15px #000;
}

#status{
    margin-top:5px;
    color:#aeb7c5;
    font-size:13px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
}

#crosshair span,
#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
    box-shadow:0 0 5px rgba(255,255,255,.7);
}

#crosshair:before{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#crosshair:after{
    width:18px;
    height:2px;
    left:0;
    top:8px;
}

#healthBox{
    position:absolute;
    left:25px;
    bottom:25px;
    width:260px;
}

#healthText{
    font-weight:900;
    font-size:20px;
    margin-bottom:7px;
}

#healthBar{
    height:12px;
    width:100%;
    background:#1a1e25;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.12);
}

#healthFill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#ff304f,#ff7650);
    transition:.15s;
}

#weaponBox{
    position:absolute;
    right:25px;
    bottom:20px;
    text-align:right;
}

#weaponName{
    font-size:24px;
    font-weight:900;
}

#ammo{
    font-size:17px;
    color:#aab3c0;
}

#hint{
    position:absolute;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    color:rgba(255,255,255,.45);
    font-size:12px;
}

#hitMarker{
    position:absolute;
    left:50%;
    top:50%;
    width:38px;
    height:38px;
    transform:translate(-50%,-50%);
    opacity:0;
}

#hitMarker:before,
#hitMarker:after{
    content:"";
    position:absolute;
    inset:8px;
    border:2px solid white;
    transform:rotate(45deg);
}

#damageFlash{
    position:absolute;
    inset:0;
    background:rgba(255,0,30,.15);
    opacity:0;
}

#message{
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    font-size:38px;
    font-weight:900;
    text-align:center;
    opacity:0;
    text-shadow:0 5px 30px black;
}

#loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:50;
    color:white;
    font-weight:bold;
    background:rgba(0,0,0,.75);
    padding:15px 22px;
    border-radius:10px;
    display:none;
}

#miniInfo{
    margin-top:18px;
    color:#687486;
    font-size:12px;
    line-height:1.6;
}

@media(max-width:700px){
    #healthBox{
        left:12px;
        bottom:12px;
        width:180px;
    }

    #weaponBox{
        right:12px;
        bottom:12px;
    }

    #weaponName{
        font-size:18px;
    }

    .logo{
        font-size:34px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <div class="panel">
        <div class="logo">RIVALS</div>
        <div class="sub">SCHOOLGAME FPS</div>

        <input id="nameInput" placeholder="მოთამაშის სახელი" maxlength="16">

        <button id="createBtn">CREATE MATCH</button>
        <button id="joinBtn" class="secondary">JOIN MATCH</button>

        <div id="miniInfo">
            WASD — მოძრაობა<br>
            SHIFT — სირბილი<br>
            SPACE — ხტომა<br>
            მაუსი — ხედვა<br>
            LEFT CLICK — სროლა
        </div>
    </div>
</div>

<div id="lobby" class="hidden">
    <div class="panel">
        <div class="logo" style="font-size:32px">MATCH</div>
        <div id="roomText" class="sub">ოთახი იქმნება...</div>

        <button id="botBtn">PLAY VS BOT</button>
        <button id="copyBtn" class="secondary">COPY ROOM CODE</button>
        <button id="backBtn" class="secondary">BACK</button>
    </div>
</div>

<div id="gameOver" class="hidden">
    <div class="panel">
        <div id="gameOverTitle" class="logo" style="font-size:38px">
            GAME OVER
        </div>

        <div id="gameOverText" class="sub"></div>

        <button id="againBtn">PLAY AGAIN</button>
        <button id="menuBtn" class="secondary">MENU</button>
    </div>
</div>

<div id="hud" class="hidden">

    <div id="topHud">
        <div id="score">0 : 0</div>
        <div id="status">WAITING</div>
    </div>

    <div id="crosshair"></div>

    <div id="hitMarker"></div>

    <div id="damageFlash"></div>

    <div id="message"></div>

    <div id="healthBox">
        <div id="healthText">100 HP</div>
        <div id="healthBar">
            <div id="healthFill"></div>
        </div>
    </div>

    <div id="weaponBox">
        <div id="weaponName">RIFLE</div>
        <div id="ammo">30 / ∞</div>
    </div>

    <div id="hint">
        CLICK TO LOCK MOUSE · WASD MOVE · SHIFT RUN · SPACE JUMP
    </div>
</div>

<div id="loading">Connecting...</div>

<script>

/* =========================================================
   CONNECTION
========================================================= */

const SERVER_URL =
    "wss://schoolgame-rivals.onrender.com";

let socket = null;

let roomCode = "";
let myId = null;
let myName = "Player";

let players = {};
let bullets = [];

let gameRunning = false;
let gameStarted = false;

let scoreA = 0;
let scoreB = 0;


/* =========================================================
   DOM
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const lobby = document.getElementById("lobby");
const gameOver = document.getElementById("gameOver");
const hud = document.getElementById("hud");

const loading = document.getElementById("loading");

const nameInput = document.getElementById("nameInput");

const roomText = document.getElementById("roomText");

const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");

const healthText = document.getElementById("healthText");
const healthFill = document.getElementById("healthFill");

const weaponName = document.getElementById("weaponName");
const ammoEl = document.getElementById("ammo");

const hitMarker = document.getElementById("hitMarker");
const damageFlash = document.getElementById("damageFlash");
const messageEl = document.getElementById("message");


/* =========================================================
   CANVAS
========================================================= */

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = Math.max(640, Math.floor(W * devicePixelRatio));
    canvas.height = Math.max(360, Math.floor(H * devicePixelRatio));

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

addEventListener("resize", resize);
resize();


/* =========================================================
   PLAYER
========================================================= */

let me = {
    x: 4.5,
    y: 4.5,
    z: 0,

    vx:0,
    vy:0,

    angle:0,

    hp:100,

    grounded:true
};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

addEventListener("keydown", e => {

    keys[e.code] = true;

    if(
        ["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)
    ){
        e.preventDefault();
    }

    if(e.code === "Space"){
        jump();
    }
});

addEventListener("keyup", e => {
    keys[e.code] = false;
});


/* =========================================================
   MOUSE LOOK
========================================================= */

let mouseDown = false;

canvas.addEventListener("click", () => {

    if(!gameRunning) return;

    if(document.pointerLockElement !== canvas){

        canvas.requestPointerLock().catch(()=>{});

    }else{

        shoot();
    }
});

canvas.addEventListener("mousedown", e => {

    if(e.button === 0){

        mouseDown = true;

        if(
            document.pointerLockElement === canvas
        ){
            shoot();
        }
    }
});

canvas.addEventListener("mouseup", e => {

    if(e.button === 0){
        mouseDown = false;
    }
});

document.addEventListener("mousemove", e => {

    if(!gameRunning) return;

    if(document.pointerLockElement !== canvas) return;

    me.angle += e.movementX * 0.0028;

});


/* =========================================================
   CAMERA
========================================================= */

let cameraBob = 0;

function jump(){

    if(!gameRunning) return;

    if(me.grounded){

        me.vy = 5.8;
        me.grounded = false;
    }
}


/* =========================================================
   ARENA MAP
=========================================================

   0 = floor
   1 = wall
   2 = cover
   3 = tall cover
   4 = special wall
*/

const MAP = [

"111111111111111111111111111",
"100000000000000000000000001",
"100000000000000000000000001",
"100001111100000011111000001",
"100001000100000010001000001",
"100001000100000010001000001",
"100001000100000010001000001",
"100001000111111110001000001",
"100000000000000000000000001",
"100000002000000000200000001",
"100000000000000000000000001",
"100011111000000001111100001",
"100010000000000000000100001",
"100010000000000000000100001",
"100010000000000000000100001",
"100011111000000001111100001",
"100000000000000000000000001",
"100000020000000000002000001",
"100000000000000000000000001",
"100001111000000001111000001",
"100001001000000001001000001",
"100001001000000001001000001",
"100001001000000001001000001",
"100001111000000001111000001",
"100000000000000000000000001",
"100000000000000000000000001",
"111111111111111111111111111"

];

const MAP_W = MAP[0].length;
const MAP_H = MAP.length;


/* =========================================================
   COLLISION
========================================================= */

function cell(x,y){

    const ix = Math.floor(x);
    const iy = Math.floor(y);

    if(
        iy < 0 ||
        iy >= MAP_H ||
        ix < 0 ||
        ix >= MAP_W
    ){
        return "1";
    }

    return MAP[iy][ix];
}

function solid(x,y){

    const c = cell(x,y);

    return c === "1" ||
           c === "2" ||
           c === "3" ||
           c === "4";
}

function canMove(x,y){

    const r = .22;

    return !solid(x-r,y-r) &&
           !solid(x+r,y-r) &&
           !solid(x-r,y+r) &&
           !solid(x+r,y+r);
}


/* =========================================================
   MOVEMENT
========================================================= */

let lastMove = performance.now();

function updateMovement(dt){

    if(!gameRunning) return;

    let forward = 0;
    let strafe = 0;

    if(keys["KeyW"] || keys["ArrowUp"])
        forward += 1;

    if(keys["KeyS"] || keys["ArrowDown"])
        forward -= 1;

    if(keys["KeyA"] || keys["ArrowLeft"])
        strafe -= 1;

    if(keys["KeyD"] || keys["ArrowRight"])
        strafe += 1;

    const len = Math.hypot(forward,strafe);

    if(len > 0){

        forward /= len;
        strafe /= len;
    }

    let speed = 3.5;

    if(keys["ShiftLeft"] || keys["ShiftRight"]){
        speed = 5.4;
    }

    const cos = Math.cos(me.angle);
    const sin = Math.sin(me.angle);

    const dx =
        (cos * forward - sin * strafe) *
        speed *
        dt;

    const dy =
        (sin * forward + cos * strafe) *
        speed *
        dt;

    if(canMove(me.x + dx, me.y)){
        me.x += dx;
    }

    if(canMove(me.x, me.y + dy)){
        me.y += dy;
    }

    if(len > 0){
        cameraBob += dt * speed * 8;
    }

    /* gravity */

    me.vy -= 14 * dt;

    me.z += me.vy * dt;

    if(me.z <= 0){

        me.z = 0;
        me.vy = 0;
        me.grounded = true;
    }

}


/* =========================================================
   SERVER INPUT
========================================================= */

let inputTimer = 0;

function sendInput(dt){

    inputTimer += dt;

    if(inputTimer < .04) return;

    inputTimer = 0;

    if(!socket || socket.readyState !== WebSocket.OPEN)
        return;

    socket.send(JSON.stringify({

        type:"input",

        x:me.x,
        y:me.y,
        angle:me.angle,

        shooting:mouseDown,

        keys:{
            w:!!keys["KeyW"],
            a:!!keys["KeyA"],
            s:!!keys["KeyS"],
            d:!!keys["KeyD"]
        }
    }));
}


/* =========================================================
   SHOOTING
========================================================= */

let lastShot = 0;

const FIRE_RATE = 105;

function shoot(){

    if(!gameRunning) return;

    const now = performance.now();

    if(now - lastShot < FIRE_RATE)
        return;

    lastShot = now;

    if(socket && socket.readyState === WebSocket.OPEN){

        socket.send(JSON.stringify({

            type:"shoot",

            angle:me.angle,

            x:me.x,
            y:me.y
        }));
    }

    createMuzzleFlash();
}


/* =========================================================
   MUZZLE FLASH
========================================================= */

let muzzle = 0;

function createMuzzleFlash(){

    muzzle = .08;
}


/* =========================================================
   RAYCAST
========================================================= */

const FOV = Math.PI / 3;

function castRay(angle){

    const sin = Math.sin(angle);
    const cos = Math.cos(angle);

    let mapX = Math.floor(me.x);
    let mapY = Math.floor(me.y);

    const deltaX = Math.abs(1 / cos);
    const deltaY = Math.abs(1 / sin);

    let stepX;
    let stepY;

    let sideX;
    let sideY;

    if(cos < 0){

        stepX = -1;
        sideX =
            (me.x - mapX) * deltaX;

    }else{

        stepX = 1;
        sideX =
            (mapX + 1 - me.x) * deltaX;
    }

    if(sin < 0){

        stepY = -1;
        sideY =
            (me.y - mapY) * deltaY;

    }else{

        stepY = 1;
        sideY =
            (mapY + 1 - me.y) * deltaY;
    }

    let side = 0;

    for(let i=0;i<80;i++){

        if(sideX < sideY){

            sideX += deltaX;
            mapX += stepX;
            side = 0;

        }else{

            sideY += deltaY;
            mapY += stepY;
            side = 1;
        }

        if(
            mapX < 0 ||
            mapX >= MAP_W ||
            mapY < 0 ||
            mapY >= MAP_H
        ){
            break;
        }

        const c = MAP[mapY][mapX];

        if(
            c === "1" ||
            c === "2" ||
            c === "3" ||
            c === "4"
        ){

            const dist =
                side === 0
                ? sideX - deltaX
                : sideY - deltaY;

            return {
                dist:Math.max(.01,dist),
                cell:c,
                side
            };
        }
    }

    return {
        dist:50,
        cell:"0",
        side:0
    };
}


/* =========================================================
   DRAW SKY
========================================================= */

function drawSky(){

    const g =
        ctx.createLinearGradient(
            0,0,
            0,H/2
        );

    g.addColorStop(0,"#050912");
    g.addColorStop(.55,"#121b2a");
    g.addColorStop(1,"#27364a");

    ctx.fillStyle = g;

    ctx.fillRect(
        0,
        0,
        W,
        H/2
    );

    /* clouds / distant shapes */

    ctx.fillStyle = "rgba(255,255,255,.025)";

    for(let i=0;i<8;i++){

        const x =
            ((i*310 - me.angle*90) % (W+500))
            - 200;

        const y =
            70 + i%3*70;

        ctx.fillRect(
            x,
            y,
            180,
            20
        );
    }
}


/* =========================================================
   DRAW FLOOR
========================================================= */

function drawFloor(){

    const g =
        ctx.createLinearGradient(
            0,
            H/2,
            0,
            H
        );

    g.addColorStop(0,"#1b222d");
    g.addColorStop(.45,"#0e141d");
    g.addColorStop(1,"#05070b");

    ctx.fillStyle = g;

    ctx.fillRect(
        0,
        H/2,
        W,
        H/2
    );

    /* perspective floor lines */

    ctx.save();

    ctx.globalAlpha = .18;

    ctx.strokeStyle = "#657180";
    ctx.lineWidth = 1;

    const horizon = H/2;

    for(let i=1;i<28;i++){

        const p =
            Math.pow(i/28,1.8);

        const y =
            horizon +
            p*(H-horizon);

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }

    const center = W/2;

    for(let i=-18;i<=18;i++){

        ctx.beginPath();

        ctx.moveTo(
            center,
            horizon
        );

        ctx.lineTo(
            center + i*100,
            H
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   DRAW WALLS
========================================================= */

function drawWalls(){

    const maxRays = Math.min(
        1050,
        Math.max(520,W)
    );

    const step =
        W / maxRays;

    for(
        let x=0;
        x<W;
        x+=step
    ){

        const cameraX =
            x/W - .5;

        const rayAngle =
            me.angle +
            cameraX * FOV;

        const ray =
            castRay(rayAngle);

        const corrected =
            ray.dist *
            Math.cos(
                rayAngle - me.angle
            );

        const wallHeight =
            H / Math.max(
                .05,
                corrected
            );

        let top =
            H/2 -
            wallHeight/2;

        let bottom =
            H/2 +
            wallHeight/2;

        if(ray.cell === "2"){
            top -= wallHeight*.15;
        }

        if(ray.cell === "3"){
            top -= wallHeight*.55;
        }

        if(ray.cell === "4"){
            top -= wallHeight*.30;
        }

        const light =
            Math.max(
                .2,
                1 - corrected/15
            );

        let r,g,b;

        if(ray.cell === "2"){

            r = 60;
            g = 75;
            b = 92;

        }else if(ray.cell === "3"){

            r = 95;
            g = 75;
            b = 45;

        }else if(ray.cell === "4"){

            r = 50;
            g = 85;
            b = 105;

        }else{

            r = 115;
            g = 125;
            b = 137;
        }

        if(ray.side){

            r*=.72;
            g*=.72;
            b*=.72;
        }

        r*=light;
        g*=light;
        b*=light;

        ctx.fillStyle =
            `rgb(${r|0},${g|0},${b|0})`;

        ctx.fillRect(
            x,
            top,
            step+1,
            bottom-top
        );

        /* wall panel details */

        if(
            corrected < 8 &&
            Math.floor(x/step)%7 === 0
        ){

            ctx.fillStyle =
                `rgba(255,255,255,${.045*light})`;

            ctx.fillRect(
                x,
                top,
                1,
                bottom-top
            );
        }
    }
}


/* =========================================================
   WORLD OBJECTS
========================================================= */

function worldToScreen(wx,wy){

    const dx = wx-me.x;
    const dy = wy-me.y;

    const dist =
        Math.hypot(dx,dy);

    let angle =
        Math.atan2(dy,dx)-me.angle;

    while(angle > Math.PI)
        angle -= Math.PI*2;

    while(angle < -Math.PI)
        angle += Math.PI*2;

    if(Math.abs(angle)>FOV*.65)
        return null;

    const corrected =
        dist*Math.cos(angle);

    if(corrected <= .1)
        return null;

    const sx =
        W/2 +
        Math.tan(angle) /
        Math.tan(FOV/2) *
        W/2;

    return {
        x:sx,
        dist:corrected,
        rawDist:dist
    };
}


/* =========================================================
   ENEMIES
========================================================= */

function drawPlayers(){

    const list =
        Object.values(players);

    list.sort(
        (a,b)=>{

            const da =
                Math.hypot(
                    a.x-me.x,
                    a.y-me.y
                );

            const db =
                Math.hypot(
                    b.x-me.x,
                    b.y-me.y
                );

            return db-da;
        }
    );

    for(const p of list){

        if(p.id === myId)
            continue;

        if(
            p.hp !== undefined &&
            p.hp <= 0
        )
            continue;

        const s =
            worldToScreen(
                p.x,
                p.y
            );

        if(!s)
            continue;

        const height =
            Math.min(
                500,
                H/s.dist
            );

        const width =
            height*.34;

        const bottom =
            H/2 +
            H/(s.dist)*me.z;

        const top =
            bottom-height;

        /* shadow */

        ctx.fillStyle =
            "rgba(0,0,0,.35)";

        ctx.beginPath();

        ctx.ellipse(
            s.x,
            bottom+3,
            width*.6,
            width*.18,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        /* legs */

        ctx.fillStyle="#171a20";

        ctx.fillRect(
            s.x-width*.32,
            top+height*.62,
            width*.22,
            height*.38
        );

        ctx.fillRect(
            s.x+width*.10,
            top+height*.62,
            width*.22,
            height*.38
        );

        /* body */

        const bodyGrad =
            ctx.createLinearGradient(
                s.x-width/2,
                0,
                s.x+width/2,
                0
            );

        bodyGrad.addColorStop(
            0,
            "#202833"
        );

        bodyGrad.addColorStop(
            .5,
            "#4a5665"
        );

        bodyGrad.addColorStop(
            1,
            "#171c24"
        );

        ctx.fillStyle = bodyGrad;

        ctx.fillRect(
            s.x-width*.43,
            top+height*.29,
            width*.86,
            height*.37
        );

        /* head */

        ctx.fillStyle="#b9a28d";

        ctx.beginPath();

        ctx.arc(
            s.x,
            top+height*.18,
            width*.28,
            0,
            Math.PI*2
        );

        ctx.fill();

        /* helmet */

        ctx.fillStyle="#252c36";

        ctx.beginPath();

        ctx.arc(
            s.x,
            top+height*.13,
            width*.29,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        /* gun */

        ctx.strokeStyle="#11151b";
        ctx.lineWidth=Math.max(2,width*.1);

        ctx.beginPath();

        ctx.moveTo(
            s.x+width*.2,
            top+height*.46
        );

        ctx.lineTo(
            s.x+width*.72,
            top+height*.52
        );

        ctx.stroke();

        /* name */

        if(s.dist < 12){

            ctx.font =
                "bold 12px Arial";

            ctx.textAlign="center";

            ctx.fillStyle="white";

            ctx.fillText(
                p.name || "BOT",
                s.x,
                top-10
            );

            /* hp */

            const hp =
                Math.max(
                    0,
                    Math.min(
                        100,
                        p.hp ?? 100
                    )
                );

            ctx.fillStyle="#14181f";

            ctx.fillRect(
                s.x-25,
                top-6,
                50,
                4
            );

            ctx.fillStyle="#e83d50";

            ctx.fillRect(
                s.x-25,
                top-6,
                50*(hp/100),
                4
            );
        }
    }
}


/* =========================================================
   WEAPON
========================================================= */

function drawWeapon(){

    const moving =
        keys["KeyW"] ||
        keys["KeyA"] ||
        keys["KeyS"] ||
        keys["KeyD"];

    const bob =
        moving
        ? Math.sin(cameraBob)*5
        : Math.sin(performance.now()/900)*1.5;

    const gunW =
        Math.min(
            430,
            W*.43
        );

    const gunH =
        gunW*.25;

    const x =
        W/2 -
        gunW*.15;

    const y =
        H -
        gunH*.75 +
        bob;

    ctx.save();

    /* arm */

    ctx.fillStyle="#a98770";

    ctx.beginPath();

    ctx.ellipse(
        x+gunW*.05,
        y+gunH*.45,
        gunW*.13,
        gunH*.25,
        -.2,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* weapon body */

    const gunGrad =
        ctx.createLinearGradient(
            x,
            y,
            x,
            y+gunH
        );

    gunGrad.addColorStop(
        0,
        "#414b58"
    );

    gunGrad.addColorStop(
        .4,
        "#161b22"
    );

    gunGrad.addColorStop(
        1,
        "#07090d"
    );

    ctx.fillStyle=gunGrad;

    ctx.beginPath();

    ctx.moveTo(x,y+gunH*.25);

    ctx.lineTo(
        x+gunW*.63,
        y+gunH*.18
    );

    ctx.lineTo(
        x+gunW*.88,
        y+gunH*.45
    );

    ctx.lineTo(
        x+gunW*.62,
        y+gunH*.72
    );

    ctx.lineTo(
        x+gunW*.28,
        y+gunH*.68
    );

    ctx.closePath();

    ctx.fill();

    /* barrel */

    ctx.fillStyle="#090b0f";

    ctx.fillRect(
        x+gunW*.58,
        y+gunH*.34,
        gunW*.4,
        gunH*.14
    );

    /* magazine */

    ctx.fillStyle="#10151b";

    ctx.fillRect(
        x+gunW*.31,
        y+gunH*.6,
        gunW*.16,
        gunH*.35
    );

    /* muzzle flash */

    if(muzzle>0){

        ctx.fillStyle =
            `rgba(255,190,70,${Math.min(1,muzzle*12)})`;

        ctx.beginPath();

        ctx.moveTo(
            x+gunW*.97,
            y+gunH*.41
        );

        ctx.lineTo(
            x+gunW*1.16,
            y+gunH*.3
        );

        ctx.lineTo(
            x+gunW*1.08,
            y+gunH*.48
        );

        ctx.lineTo(
            x+gunW*1.16,
            y+gunH*.62
        );

        ctx.closePath();

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   HIT MARKER
========================================================= */

let hitTimer=0;

function showHit(){

    hitTimer=.14;

    hitMarker.style.opacity="1";
}


/* =========================================================
   DAMAGE
========================================================= */

let damageTimer=0;

function showDamage(){

    damageTimer=.18;

    damageFlash.style.opacity="1";
}


/* =========================================================
   MESSAGES
========================================================= */

function showMessage(text,time=1){

    messageEl.textContent=text;
    messageEl.style.opacity="1";

    setTimeout(()=>{

        messageEl.style.opacity="0";

    },time*1000);
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    const hp =
        Math.max(
            0,
            Math.min(
                100,
                me.hp
            )
        );

    healthText.textContent =
        Math.round(hp)+" HP";

    healthFill.style.width =
        hp+"%";

    scoreEl.textContent =
        scoreA+" : "+scoreB;

}


/* =========================================================
   GAME LOOP
========================================================= */

let previous =
    performance.now();

function loop(now){

    const dt =
        Math.min(
            .05,
            (now-previous)/1000
        );

    previous=now;

    if(gameRunning){

        updateMovement(dt);
        sendInput(dt);

        muzzle -= dt;

        if(muzzle<0)
            muzzle=0;

        hitTimer-=dt;

        if(hitTimer<=0)
            hitMarker.style.opacity="0";

        damageTimer-=dt;

        if(damageTimer<=0)
            damageFlash.style.opacity="0";

        drawSky();
        drawFloor();
        drawWalls();
        drawPlayers();
        drawWeapon();

        updateHUD();

        if(mouseDown)
            shoot();
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   WEBSOCKET
========================================================= */

function connect(){

    loading.style.display="block";
    loading.textContent="Connecting...";

    try{

        socket =
            new WebSocket(SERVER_URL);

    }catch(err){

        loading.textContent =
            "Connection failed";

        return;
    }

    socket.onopen = () => {

        loading.style.display="none";

        statusEl.textContent =
            "CONNECTED";
    };

    socket.onclose = () => {

        loading.style.display="none";

        if(gameRunning){

            statusEl.textContent =
                "DISCONNECTED";
        }
    };

    socket.onerror = () => {

        loading.textContent =
            "Server connection error";
    };

    socket.onmessage = e => {

        let data;

        try{
            data = JSON.parse(e.data);
        }catch{
            return;
        }

        handleServerMessage(data);
    };
}


/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleServerMessage(data){

    switch(data.type){

        case "created":

            roomCode =
                data.room ||
                data.roomCode ||
                "";

            roomText.textContent =
                "ROOM: "+roomCode;

            menu.classList.add("hidden");
            lobby.classList.remove("hidden");

            break;


        case "room_created":

            roomCode =
                data.room ||
                data.roomCode ||
                "";

            roomText.textContent =
                "ROOM: "+roomCode;

            menu.classList.add("hidden");
            lobby.classList.remove("hidden");

            break;


        case "joined":

            roomCode =
                data.room ||
                data.roomCode ||
                roomCode;

            menu.classList.add("hidden");
            lobby.classList.remove("hidden");

            roomText.textContent =
                "ROOM: "+roomCode;

            break;


        case "player_id":

            myId =
                data.id;

            break;


        case "state":

            if(data.players){

                players = {};

                for(const p of data.players){

                    players[p.id] = p;

                    if(
                        p.id === myId
                    ){

                        /*
                         * Keep local movement responsive.
                         * Server values are used as correction
                         * when available.
                         */

                        if(
                            Number.isFinite(p.hp)
                        ){
                            me.hp=p.hp;
                        }

                        if(
                            Number.isFinite(p.x) &&
                            Number.isFinite(p.y)
                        ){

                            const dx =
                                p.x-me.x;

                            const dy =
                                p.y-me.y;

                            if(
                                Math.hypot(dx,dy) > 1.5
                            ){

                                me.x=p.x;
                                me.y=p.y;
                            }
                        }
                    }
                }
            }

            if(
                Number.isFinite(data.scoreA)
            ){
                scoreA=data.scoreA;
            }

            if(
                Number.isFinite(data.scoreB)
            ){
                scoreB=data.scoreB;
            }

            updateHUD();

            break;


        case "started":

            startGame();

            break;


        case "game_start":

            startGame();

            break;


        case "bot_joined":

            showMessage(
                "BOT JOINED",
                1
            );

            startGame();

            break;


        case "hit":

            if(
                data.targetId &&
                data.targetId !== myId
            ){

                showHit();
            }

            if(
                data.attackerId === myId
            ){

                showHit();
            }

            break;


        case "damaged":

            if(
                data.targetId === myId ||
                data.playerId === myId
            ){

                showDamage();
            }

            break;


        case "game_over":

            endGame(
                data.winner ||
                data.message ||
                "GAME OVER"
            );

            break;


        case "round_end":

            showMessage(
                data.message ||
                "ROUND",
                1.5
            );

            break;


        case "message":

            if(data.message){

                showMessage(
                    data.message,
                    1.5
                );
            }

            break;
    }
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    gameStarted=true;
    gameRunning=true;

    menu.classList.add("hidden");
    lobby.classList.add("hidden");
    gameOver.classList.add("hidden");

    hud.classList.remove("hidden");

    me.hp=100;

    statusEl.textContent =
        "FIGHT";

    showMessage(
        "FIGHT!",
        1
    );

    setTimeout(()=>{

        if(gameRunning){

            canvas.requestPointerLock()
                .catch(()=>{});

        }

    },300);
}


/* =========================================================
   END GAME
========================================================= */

function endGame(result){

    gameRunning=false;

    document.exitPointerLock?.();

    gameOver.classList.remove("hidden");

    document.getElementById(
        "gameOverText"
    ).textContent =
        typeof result === "string"
        ? result
        : "MATCH FINISHED";

}


/* =========================================================
   BUTTONS
========================================================= */

function ensureSocket(){

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        connect();
        return false;
    }

    return true;
}


document.getElementById("createBtn")
.addEventListener("click",()=>{

    myName =
        nameInput.value.trim() ||
        "Player";

    if(!ensureSocket()){

        setTimeout(()=>{

            if(socket &&
               socket.readyState === WebSocket.OPEN){

                socket.send(JSON.stringify({

                    type:"create",
                    name:myName
                }));
            }

        },500);

        return;
    }

    socket.send(JSON.stringify({

        type:"create",
        name:myName
    }));

});


document.getElementById("joinBtn")
.addEventListener("click",()=>{

    myName =
        nameInput.value.trim() ||
        "Player";

    const code =
        prompt(
            "შეიყვანე ROOM CODE:"
        );

    if(!code) return;

    roomCode =
        code.trim();

    if(!ensureSocket()){

        setTimeout(()=>{

            if(socket &&
               socket.readyState === WebSocket.OPEN){

                socket.send(JSON.stringify({

                    type:"join",
                    room:roomCode,
                    name:myName
                }));
            }

        },500);

        return;
    }

    socket.send(JSON.stringify({

        type:"join",
        room:roomCode,
        name:myName
    }));

});


document.getElementById("botBtn")
.addEventListener("click",()=>{

    if(!socket ||
       socket.readyState !== WebSocket.OPEN){

        connect();

        setTimeout(()=>{

            if(socket &&
               socket.readyState === WebSocket.OPEN){

                socket.send(JSON.stringify({
                    type:"add_bot"
                }));
            }

        },500);

        return;
    }

    socket.send(JSON.stringify({
        type:"add_bot"
    }));

});


document.getElementById("copyBtn")
.addEventListener("click",async()=>{

    if(!roomCode) return;

    try{

        await navigator.clipboard.writeText(
            roomCode
        );

        roomText.textContent =
            "COPIED: "+roomCode;

        setTimeout(()=>{

            roomText.textContent =
                "ROOM: "+roomCode;

        },1200);

    }catch{

        prompt(
            "Copy room code:",
            roomCode
        );
    }
});


document.getElementById("backBtn")
.addEventListener("click",()=>{

    lobby.classList.add("hidden");
    menu.classList.remove("hidden");

});


document.getElementById("againBtn")
.addEventListener("click",()=>{

    gameOver.classList.add("hidden");
    lobby.classList.remove("hidden");

});


document.getElementById("menuBtn")
.addEventListener("click",()=>{

    gameOver.classList.add("hidden");
    hud.classList.add("hidden");
    menu.classList.remove("hidden");

    gameRunning=false;

});


/* =========================================================
   INITIAL CONNECTION
========================================================= */

connect();


/* =========================================================
   PREVENT TAB SCROLL
========================================================= */

addEventListener("wheel",e=>{

    if(gameRunning)
        e.preventDefault();

},{passive:false});


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "pointerlockchange",
    ()=>{

        if(
            gameRunning &&
            document.pointerLockElement === canvas
        ){

            statusEl.textContent =
                "FIGHT";

        }else if(gameRunning){

            statusEl.textContent =
                "CLICK TO PLAY";
        }
    }
);


/* =========================================================
   MOBILE / FOCUS SAFETY
========================================================= */

addEventListener("blur",()=>{

    for(const k in keys)
        keys[k]=false;

    mouseDown=false;
});


/* =========================================================
   AUTO FIRE SUPPORT
========================================================= */

setInterval(()=>{

    if(
        gameRunning &&
        mouseDown
    ){

        shoot();
    }

},30);
