
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAR BUILDER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d13;color:#f4f7fb;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#121a24}
h1{margin:0;color:#5cf5d0;letter-spacing:4px}
main{max-width:1200px;margin:auto;padding:18px}
.garage{padding:16px;background:#121a24;border:1px solid #30404e;border-radius:16px;text-align:center}
#carImage{display:block;width:100%;max-width:1000px;height:380px;object-fit:cover;margin:12px auto;border-radius:12px;background:#202a35}
.controls,.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
button{padding:10px 14px;border:1px solid #354957;border-radius:9px;background:#1a2733;color:white;cursor:pointer}
button:hover,button.active{background:#5cf5d0;color:#07120f}
#parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.part{background:#121a24;border:1px solid #30404e;border-radius:12px;overflow:hidden}
.part img{width:100%;height:145px;object-fit:cover;background:#202a35}
.info{padding:12px}
.info h3{font-size:15px;margin:0 0 8px}
.info p{font-size:12px;color:#a9b6c3}
.info button{width:100%}
#installed{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:10px;border-radius:8px;background:#18332c;cursor:pointer}
#status{color:#5cf5d0;min-height:24px}
small{color:#9aa9b8}
@media(max-width:600px){#carImage{height:230px}}
</style>
</head>
<body>
<header>
<h1>CAR BUILDER</h1>
<p>ააწყვე შენი მანქანა</p>
</header>

<main>
<section class="garage">
<h2>ჩემი მანქანა</h2>
<img id="carImage"
src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=85"
alt="სპორტული ავტომობილი">
<div>ძრავა: <b id="engineText">არ არის არჩეული</b></div>
<div>დისკები: <b id="wheelText">არ არის არჩეული</b></div>
<div class="controls">
<label>მანქანის ფერი <input type="color" id="paint" value="#5cf5d0"></label>
<button onclick="randomBuild()">🎲 შემთხვევითი აწყობა</button>
<button onclick="resetBuild()">↻ გასუფთავება</button>
<button onclick="finishBuild()">✓ დასრულება</button>
</div>
<div id="status"></div>
</section>

<h2>კატეგორიები</h2>
<div class="tabs" id="tabs"></div>
<h2>ნაწილები</h2>
<div id="parts"></div>
<h2>დაყენებული ნაწილები <small>დააჭირე ნაწილს მოსაშორებლად</small></h2>
<div id="installed"></div>
</main>

<script>
const categories=[
["ძრავა","engine",[
["1.0L ძრავა","https://loremflickr.com/640/420/car,engine?lock=101"],
["1.2L ძრავა","https://loremflickr.com/640/420/car,engine?lock=102"],
["1.6L ძრავა","https://loremflickr.com/640/420/car,engine?lock=103"],
["2.0L Turbo","https://loremflickr.com/640/420/turbo,engine?lock=104"],
["3.0L V6","https://loremflickr.com/640/420/V6,engine?lock=105"],
["5.0L V8","https://loremflickr.com/640/420/V8,engine?lock=106"]]],
["დისკები","wheels",[
["15-inch Classic","https://loremflickr.com/640/420/car,alloy,wheel?lock=201"],
["16-inch Sport","https://loremflickr.com/640/420/sport,alloy,wheel?lock=202"],
["17-inch Multi-Spoke","https://loremflickr.com/640/420/alloy,wheel?lock=203"],
["18-inch Racing","https://loremflickr.com/640/420/racing,wheel?lock=204"],
["19-inch Premium","https://loremflickr.com/640/420/black,alloy,wheel?lock=205"],
["20-inch Performance","https://loremflickr.com/640/420/performance,wheel?lock=206"]]],
["ტურბო","turbo",[
["Small Turbo","https://loremflickr.com/640/420/turbocharger?lock=301"],
["Twin Turbo","https://loremflickr.com/640/420/twin,turbo?lock=302"],
["Ball Bearing Turbo","https://loremflickr.com/640/420/turbocharger,engine?lock=303"],
["Big Turbo","https://loremflickr.com/640/420/big,turbocharger?lock=304"]]],
["მუხრუჭები","brakes",[
["სტანდარტული მუხრუჭები","https://loremflickr.com/640/420/car,disc,brake?lock=401"],
["Sport Disc","https://loremflickr.com/640/420/sport,brake,disc?lock=402"],
["Performance Brakes","https://loremflickr.com/640/420/performance,brakes?lock=403"]]],
["საჭე","steering",[
["Classic Steering","https://loremflickr.com/640/420/car,steering,wheel?lock=501"],
["Sport Steering","https://loremflickr.com/640/420/sport,steering,wheel?lock=502"],
["Racing Steering","https://loremflickr.com/640/420/racing,steering,wheel?lock=503"]]],
["სავარძლები","seats",[
["Comfort Seats","https://loremflickr.com/640/420/car,seat?lock=601"],
["Sport Seats","https://loremflickr.com/640/420/sport,car,seat?lock=602"],
["Bucket Seats","https://loremflickr.com/640/420/racing,bucket,seat?lock=603"]]],
["ფარები","lights",[
["Halogen","https://loremflickr.com/640/420/car,headlight?lock=701"],
["LED Headlights","https://loremflickr.com/640/420/LED,car,headlight?lock=702"],
["Matrix LED","https://loremflickr.com/640/420/modern,car,headlight?lock=703"]]],
["საკიდარი","suspension",[
["Comfort Suspension","https://loremflickr.com/640/420/car,suspension?lock=801"],
["Sport Suspension","https://loremflickr.com/640/420/sport,suspension?lock=802"],
["Coilovers","https://loremflickr.com/640/420/coilover,suspension?lock=803"]]],
["ძარა","body",[
["Street Body","https://loremflickr.com/640/420/sports,coupe,car?lock=901"],
["Sport Body","https://loremflickr.com/640/420/sport,car,bodykit?lock=902"],
["Widebody","https://loremflickr.com/640/420/widebody,car?lock=903"]]],
["გამონაბოლქვი","exhaust",[
["Standard Exhaust","https://loremflickr.com/640/420/car,exhaust?lock=1001"],
["Sport Exhaust","https://loremflickr.com/640/420/sport,exhaust?lock=1002"],
["Dual Exhaust","https://loremflickr.com/640/420/dual,exhaust?lock=1003"]]],
["აკუმულატორი","battery",[
["Standard Battery","https://loremflickr.com/640/420/car,battery?lock=1101"],
["AGM Battery","https://loremflickr.com/640/420/automotive,battery?lock=1102"]]],
["სპოილერი","spoiler",[
["Small Spoiler","https://loremflickr.com/640/420/car,rear,spoiler?lock=1201"],
["GT Spoiler","https://loremflickr.com/640/420/GT,spoiler,car?lock=1202"],
["Carbon Spoiler","https://loremflickr.com/640/420/carbon,fiber,spoiler?lock=1203"]]],
["რადიატორი","radiator",[
["Standard Radiator","https://loremflickr.com/640/420/car,radiator?lock=1301"],
["Aluminum Radiator","https://loremflickr.com/640/420/aluminum,radiator?lock=1302"]]],
["გადაცემათა კოლოფი","gearbox",[
["5-Speed Manual","https://loremflickr.com/640/420/manual,gearbox?lock=1401"],
["6-Speed Manual","https://loremflickr.com/640/420/gearbox,transmission?lock=1402"],
["Automatic","https://loremflickr.com/640/420/automatic,transmission?lock=1403"]]],
["სარკეები","mirrors",[
["Classic Mirrors","https://loremflickr.com/640/420/car,side,mirror?lock=1501"],
["Sport Mirrors","https://loremflickr.com/640/420/sport,car,mirror?lock=1502"]]],
["ცხაური","grille",[
["Classic Grille","https://loremflickr.com/640/420/car,front,grille?lock=1601"],
["Sport Grille","https://loremflickr.com/640/420/sport,car,grille?lock=1602"]]]
];

let active="engine";
let chosen={};

function renderTabs(){
 const root=document.getElementById("tabs");
 root.innerHTML="";
 categories.forEach(([label,key])=>{
  const b=document.createElement("button");
  b.textContent=label;
  b.className=key===active?"active":"";
  b.onclick=()=>{active=key;renderTabs();renderParts()};
  root.appendChild(b);
 });
}

function renderParts(){
 const root=document.getElementById("parts");
 root.innerHTML="";
 const cat=categories.find(c=>c[1]===active);

 cat[2].forEach(([name,url])=>{
  const card=document.createElement("article");
  card.className="part";
  const img=document.createElement("img");
  img.src=url;
  img.alt=name;
  img.loading="lazy";
  img.onerror=()=>{
   img.onerror=null;
   img.src="https://placehold.co/640x420/17232e/5cf5d0?text="+encodeURIComponent(name);
  };

  const info=document.createElement("div");
  info.className="info";
  const title=document.createElement("h3");
  title.textContent=name;
  const desc=document.createElement("p");
  desc.textContent="ნაწილი: "+cat[0];
  const btn=document.createElement("button");
  btn.textContent=chosen[active]===name?"✓ დაყენებულია":"დაყენება";
  btn.onclick=()=>{
   chosen[active]=name;
   document.getElementById("status").textContent="დაყენებულია: "+name;
   renderParts();
   renderInstalled();
  };
  info.append(title,desc,btn);
  card.append(img,info);
  root.appendChild(card);
 });
}

function renderInstalled(){
 const root=document.getElementById("installed");
 root.innerHTML="";
 Object.entries(chosen).forEach(([key,name])=>{
  const tag=document.createElement("div");
  tag.className="tag";
  tag.textContent="✕ "+name;
  tag.onclick=()=>{
   delete chosen[key];
   renderParts();
   renderInstalled();
  };
  root.appendChild(tag);
 });
 document.getElementById("engineText").textContent=chosen.engine||"არ არის არჩეული";
 document.getElementById("wheelText").textContent=chosen.wheels||"არ არის არჩეული";
}

function randomBuild(){
 categories.forEach(([label,key,items])=>{
  chosen[key]=items[Math.floor(Math.random()*items.length)][0];
 });
 renderParts();
 renderInstalled();
 document.getElementById("status").textContent="შემთხვევითი აწყობა მზადაა!";
}

function resetBuild(){
 chosen={};
 renderParts();
 renderInstalled();
 document.getElementById("status").textContent="მანქანა გასუფთავებულია.";
}

function finishBuild(){
 const count=Object.keys(chosen).length;
 document.getElementById("status").textContent=
 "არჩეულია "+count+" / "+categories.length+" კატეგორია. "+
 (count===categories.length?"მანქანა სრულად აწყობილია! 🏁":"აირჩიე დანარჩენი ნაწილებიც.");
}

document.getElementById("paint").addEventListener("input",e=>{
 document.getElementById("carImage").style.filter=
 "sepia(.2) saturate(1.2) drop-shadow(0 0 12px "+e.target.value+")";
});

renderTabs();
renderParts();
renderInstalled();
</script>
</body>
</html>
