
<style>
#xoOnlinePanel input {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 10px;
  border: 1px solid #ffffff25;
  background: #0b1628;
  color: white;
  font-size: 16px;
}
#xoOnlinePanel .menu-btn { margin-top: 9px; }
#xoOnlineStatus { color: #fbbf24; font-size: 13px; margin: 12px 0; }
</style>

<script>
(() => {
  const onlineScreen = document.getElementById('onlineScreen');
  if (!onlineScreen) return;

  const oldNote = onlineScreen.querySelector('.online-note');
  if (oldNote) {
    oldNote.innerHTML = `
      <div id="xoOnlinePanel">
        <input id="xoName" maxlength="16" placeholder="შენი სახელი">
        <button class="menu-btn primary" id="xoCreate">＋ ოთახის შექმნა</button>
        <input id="xoCode" maxlength="6" placeholder="ოთახის კოდი"
          style="text-transform:uppercase;letter-spacing:3px;text-align:center">
        <button class="menu-btn online" id="xoJoin">შეერთება</button>
        <div id="xoOnlineStatus">სერვერთან დაკავშირება მზადდება...</div>
      </div>`;
  }

  let ws;
  let myMark = '';
  let roomCode = '';
  let online = false;
  let state = null;

  const status = () => document.getElementById('xoOnlineStatus');

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN ||
               ws.readyState === WebSocket.CONNECTING)) return;

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host + '/ws');

    ws.onopen = () => {
      if (status()) status().textContent = '● სერვერთან კავშირი დამყარებულია';
    };

    ws.onmessage = event => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }

      if (msg.type === 'xo-error') {
        if (status()) status().textContent = '⚠️ ' + msg.message;
        return;
      }

      if (msg.type === 'xo-state') {
        state = msg;
        myMark = msg.myMark || myMark;
        roomCode = msg.code || roomCode;
        online = true;
        drawOnline();
        return;
      }

      if (msg.type === 'xo-opponent-left') {
        if (status()) status().textContent = msg.message;
      }

      if (msg.type === 'xo-left') {
        online = false;
        roomCode = '';
      }
    };

    ws.onclose = () => {
      if (status()) status().textContent = 'კავშირი გაწყდა. ხელახლა სცადე.';
    };

    ws.onerror = () => {
      if (status()) status().textContent = 'სერვერთან დაკავშირება ვერ მოხერხდა.';
    };
  }

  function send(data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      if (status()) status().textContent = 'სერვერთან კავშირი ჯერ არ არის.';
      return false;
    }
    ws.send(JSON.stringify(data));
    return true;
  }

  function name() {
    return document.getElementById('xoName').value.trim() || 'Player';
  }

  document.getElementById('xoCreate').onclick = () => {
    connect();
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      if (status()) status().textContent = 'დაელოდე სერვერთან დაკავშირებას და ისევ სცადე.';
      return;
    }
    send({ type: 'xo-create', name: name() });
  };

  document.getElementById('xoJoin').onclick = () => {
    connect();
    const code = document.getElementById('xoCode').value.trim().toUpperCase();

    if (code.length !== 6) {
      if (status()) status().textContent = 'შეიყვანე 6-ნიშნა ოთახის კოდი.';
      return;
    }

    if (!ws || ws.readyState !== WebSocket.OPEN) {
      if (status()) status().textContent = 'დაელოდე სერვერთან დაკავშირებას და ისევ სცადე.';
      return;
    }

    send({ type: 'xo-join', code, name: name() });
  };

  function drawOnline() {
    if (!state) return;

    const gameScreen = document.getElementById('gameScreen');
    const mainMenu = document.getElementById('mainMenu');
    const onlineScreen = document.getElementById('onlineScreen');

    mainMenu.classList.add('hidden');
    onlineScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    document.querySelector('.game-title').textContent = 'ONLINE • ' + roomCode;

    const players = state.players || [];
    const xPlayer = players.find(p => p.mark === 'X');
    const oPlayer = players.find(p => p.mark === '0');
    const playerBoxes = document.querySelectorAll('.player');

    playerBoxes[0].innerHTML =
      (xPlayer ? xPlayer.name : 'მოლოდინი...') +
      '<strong style="color:#38bdf8">X</strong>';

    playerBoxes[1].innerHTML =
      (oPlayer ? oPlayer.name : 'მოლოდინი...') +
      '<strong style="color:#fb7185">0</strong>';

    const board = state.board;
    const active = players.length === 2 && !state.winner && !state.draw;

    document.getElementById('status').textContent =
      players.length < 2 ? 'ოთახის კოდი: ' + roomCode + ' — დაელოდე მეგობარს.' :
      state.winner ? (state.winner === myMark ? '🎉 შენ გაიმარჯვე!' : '😔 მოწინააღმდეგემ გაიმარჯვა!') :
      state.draw ? '🤝 ფრეა!' :
      state.turn === myMark ? 'შენი სვლაა!' : 'მოწინააღმდეგის სვლაა...';

    document.querySelectorAll('.cell').forEach((cell, i) => {
      cell.textContent = board[i];
      cell.className = 'cell';

      if (board[i]) cell.classList.add(board[i] === 'X' ? 'x' : 'o');
      if ((state.winningCells || []).includes(i)) cell.classList.add('winner');

      cell.disabled = !active || state.turn !== myMark || board[i] !== '';

      cell.onclick = () => {
        if (!active || state.turn !== myMark || board[i] !== '') return;
        send({ type: 'xo-move', index: i });
      };
    });

    if (status()) {
      status().textContent = 'ოთახის კოდი: ' + roomCode + ' — გაუზიარე მეგობარს.';
    }
  }

  // ონლაინ Restart ღილაკი სერვერს სთხოვს დაფის განულებას.
  const restart = document.querySelector('.restart');
  if (restart) {
    restart.addEventListener('click', () => {
      if (online) {
        send({ type: 'xo-reset' });
      }
    }, true);
  }

  // ONLINE მენიუს გახსნისას ვცდილობთ კავშირს.
  const onlineButton = document.querySelector('[onclick="showOnline()"]');
  if (onlineButton) {
    onlineButton.addEventListener('click', connect);
  }
})();
</script>
