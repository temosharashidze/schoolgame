<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#172b46 0,#07101d 48%,#03070d 100%);
  color:white;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:auto;
}

.container{
  width:min(1100px,92vw);
  text-align:center;
  padding:45px 20px;
}

.logo{
  font-size:clamp(42px,8vw,82px);
  font-weight:1000;
  letter-spacing:6px;
  text-shadow:
    0 0 15px #48d9ff,
    0 0 45px #1687ff;
}

.subtitle{
  margin-top:10px;
  color:#9db5c9;
  font-size:18px;
}

.games{
  margin-top:45px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.game{
  min-height:230px;
  border:1px solid #ffffff18;
  border-radius:24px;
  padding:25px;
  background:linear-gradient(
    145deg,
    #122238dd,
    #07111ddd
  );
  box-shadow:
    0 20px 60px #0008,
    inset 0 1px #ffffff12;
  transition:.25s;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.game:hover{
  transform:translateY(-8px);
  border-color:#4bdcff66;
  box-shadow:
    0 25px 70px #000b,
    0 0 35px #159cff22;
}

.icon{
  font-size:55px;
}

.game h2{
  margin:10px 0 6px;
  font-size:25px;
}

.game p{
  color:#94a9bb;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(
    90deg,
    #087cff,
    #00c6ff
  );
  box-shadow:0 8px 25px #008cff33;
  transition:.2s;
}

button:hover{
  transform:scale(1.03);
  filter:brightness(1.12);
}

.footer{
  margin-top:35px;
  color:#536a7d;
  font-size:12px;
}

/* BY TEMX */
.creator-credit{
  position:fixed;
  right:12px;
  bottom:10px;
  z-index:99999;
  color:rgba(255,255,255,0.55);
  font-family:Arial,Helvetica,sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  pointer-events:none;
  user-select:none;
}

@media(max-width:800px){
  .games{
    grid-template-columns:1fr;
  }

  .game{
    min-height:200px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    GAMEXO
  </div>

  <div class="subtitle">
    აირჩიე თამაში და დაიწყე
  </div>

  <div class="games">

    <!-- COREBALL -->
    <div class="game">

      <div>
        <div class="icon">⚫</div>

        <h2>COREBALL</h2>

        <p>
          ზუსტი სროლა, დონეები და რთული მექანიკა.
        </p>
      </div>

      <button onclick="location.href='GAME.html'">
        PLAY COREBALL
      </button>

    </div>


    <!-- CS2 -->
    <div class="game">

      <div>
        <div class="icon">🔫</div>

        <h2>CS2 UPGRADER</h2>

        <p>
          Upgrade, skins, balance და შანსები.
        </p>
      </div>

      <button onclick="location.href='GAME2.html'">
        PLAY CS2
      </button>

    </div>


    <!-- RIVALS -->
    <div class="game">

      <div>
        <div class="icon">🔫</div>

        <h2>RIVALS</h2>

        <p>
          shooting სტილის თამაში
        </p>
      </div>

      <button onclick="location.href='GAME4.html'">
        PLAY NOW
      </button>

    </div>

  </div>

  <div class="footer">
    GAMEXO • Your games hub
  </div>

</div>

<!-- CREATOR -->

  by TEMX
