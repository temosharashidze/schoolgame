<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google / საიტის სახელი -->
    <title>schoolgame | თამაშების საიტი</title>

    <meta
        name="description"
        content="schoolgame - თამაშების საიტი. ითამაშე Coreball, CS2 Upgrader და სხვა საინტერესო თამაშები."
    >

    <meta
        name="keywords"
        content="schoolgame, school game, თამაშები, Coreball, CS2 Upgrader"
    >

    <meta name="robots" content="index, follow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.65)
                ),
                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 50px 30px;
            text-align: center;

            background: rgba(0, 0, 0, 0.75);
            border-radius: 25px;

            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #cccccc;
            margin-bottom: 35px;
        }

        #startButton {
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;

            color: white;
            background: #20c55a;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            transition: 0.3s;
        }

        #startButton:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        #games {
            display: none;
        }

        #games h2 {
            font-size: 35px;
            margin-bottom: 30px;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .game {
            padding: 25px;

            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 15px;

            font-size: 20px;
            color: white;

            cursor: pointer;
            transition: 0.3s;
        }

        .game:hover {
            background: rgba(32, 197, 90, 0.3);
            transform: translateY(-5px);
        }

        /* CS2 UPGRADER */
        .upgrader-game {
            background:
                linear-gradient(
                    135deg,
                    rgba(69, 230, 162, 0.18),
                    rgba(20, 25, 35, 0.8)
                );

            border: 1px solid rgba(69, 230, 162, 0.45);

            box-shadow:
                inset 0 0 25px rgba(69, 230, 162, 0.04);
        }

        .upgrader-game:hover {
            background:
                linear-gradient(
                    135deg,
                    rgba(69, 230, 162, 0.35),
                    rgba(20, 30, 35, 0.9)
                );

            border-color: rgba(69, 230, 162, 0.8);

            box-shadow:
                0 0 25px rgba(69, 230, 162, 0.18);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .game-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- მთავარი გვერდი -->
        <div id="welcome">

            <h1>
                🎮 მოგესალმებით schoolgame-ზე!
            </h1>

            <p>
                აქ დაგხვდებათ ბევრი საინტერესო თამაში.
                აირჩიეთ თამაში და გაერთეთ!
            </p>

            <button id="startButton">
                დაწყება
            </button>

        </div>


        <!-- თამაშების მენიუ -->
        <div id="games">

            <h2>
                🎮 აირჩიე თამაში
            </h2>

            <div class="game-list">

                <button class="game">
                    🧩 თავსატეხი
                </button>

                <button class="game">
                    🏎️ რბოლა
                </button>

                <button class="game">
                    ⚔️ ბრძოლა
                </button>

                <button class="game">
                    🧠 გამოცანა
                </button>

                <!-- Coreball -->
                <button
                    class="game"
                    onclick="openCoreball()"
                >
                    ⚫ Coreball
                </button>

                <!-- CS2 Upgrader -->
                <button
                    class="game upgrader-game"
                    onclick="openUpgrader()"
                >
                    🔫 CS2 UPGRADER
                </button>

            </div>

        </div>

    </div>


    <script>

        const startButton =
            document.getElementById("startButton");

        const welcome =
            document.getElementById("welcome");

        const games =
            document.getElementById("games");


        /* დაწყება */

        startButton.addEventListener("click", function() {

            welcome.style.display = "none";

            games.style.display = "block";

        });


        /* Coreball */

        function openCoreball() {

            window.location.href = "GAME.html";

        }


        /* CS2 Upgrader */

        function openUpgrader() {

            window.location.href = "GAME2.html";

        }

    </script>

</body>
</html>
